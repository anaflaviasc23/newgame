<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Board Game - Desafios de Inglês</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Tabuleiro em Grid (Trilha Periférica) */
        .board {
            display: grid;
            grid-template-columns: repeat(7, 80px);
            grid-template-rows: repeat(7, 80px);
            gap: 6px;
            background: #0f172a;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        .tile {
            background: #334155;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #f8fafc;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }

        .tile:hover {
            transform: scale(1.03);
        }

        /* Cores das categorias */
        .cat-tobe { background: #0284c7; }
        .cat-present { background: #16a34a; }
        .cat-continuous { background: #d97706; }
        .cat-past { background: #dc2626; }
        .cat-pastcont { background: #7c3aed; }
        .cat-vocab { background: #db2777; }
        .cat-start { background: #0d9488; font-size: 0.9rem; }
        .cat-finish { background: #4f46e5; font-size: 0.9rem; }

        .tile-number {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 0.6rem;
            opacity: 0.8;
        }

        /* Painel Central do Tabuleiro */
        .center-panel {
            grid-column: 2 / 7;
            grid-row: 2 / 7;
            background: rgba(15, 23, 42, 0.85);
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .center-panel h2 {
            font-size: 1.8rem;
            color: #f43f5e;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Painel Lateral de Controle */
        .sidebar {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dice-section {
            text-align: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
        }

        .dice {
            width: 70px;
            height: 70px;
            background: #fff;
            color: #0f172a;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .dice:active {
            transform: scale(0.9);
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #0369a1;
        }

        /* Caixa de Desafio / Pergunta */
        .challenge-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border-left: 5px solid #38bdf8;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .challenge-box h3 {
            color: #38bdf8;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .challenge-box p {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .option-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background: #475569;
        }

        .option-btn.correct {
            background: #16a34a !important;
        }

        .option-btn.wrong {
            background: #dc2626 !important;
        }

        /* Peão */
        .pawn {
            width: 32px;
            height: 32px;
            background: #facc15;
            border-radius: 50%;
            position: absolute;
            border: 3px solid #ca8a04;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 20;
            transition: all 0.4s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #713f12;
        }

        .status-text {
            font-size: 0.9rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>English Board Game</h1>
        <p>Jogue o dado, avance no tabuleiro e responda aos desafios de inglês!</p>
    </header>

    <div class="game-container">
        <!-- Tabuleiro -->
        <div class="board" id="board">
            <!-- O centro decorativo do tabuleiro -->
            <div class="center-panel">
                <h2>English Challenge</h2>
                <p class="status-text" id="board-status">Role o dado para começar o jogo!</p>
            </div>
        </div>

        <!-- Painel Lateral -->
        <div class="sidebar">
            <div class="dice-section">
                <h3>Dado</h3>
                <div class="dice" id="dice" onclick="rollDice()">🎲</div>
                <p id="dice-result">Clique no dado para jogar</p>
                <button class="btn" onclick="rollDice()" style="margin-top: 10px;">Girar Dado</button>
            </div>

            <div class="challenge-box" id="challenge-container">
                <h3>Área de Desafio</h3>
                <p id="question-text">O desafio aparecerá aqui quando você parar em uma casinha.</p>
                <div class="options-list" id="options-list"></div>
                <p id="feedback-text" style="font-weight: bold; font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>

    <script>
        // Configuração das 24 casinhas do tabuleiro em formato de anel (perímetro 7x7)
        // Coordenadas (row, col) baseadas em grid 7x7 (1 a 7)
        const tileCoords = [
            {r: 7, c: 1}, {r: 7, c: 2}, {r: 7, c: 3}, {r: 7, c: 4}, {r: 7, c: 5}, {r: 7, c: 6}, {r: 7, c: 7}, // Baixo (E->D) -> 0 a 6
            {r: 6, c: 7}, {r: 5, c: 7}, {r: 4, c: 7}, {r: 3, c: 7}, {r: 2, c: 7}, {r: 1, c: 7},          // Direita (B->T) -> 7 a 12
            {r: 1, c: 6}, {r: 1, c: 5}, {r: 1, c: 4}, {r: 1, c: 3}, {r: 1, c: 2}, {r: 1, c: 1},          // Topo (D->E) -> 13 a 18
            {r: 2, c: 1}, {r: 3, c: 1}, {r: 4, c: 1}, {r: 5, c: 1}, {r: 6, c: 1}                           // Esquerda (T->B) -> 19 a 23
        ];

        // Banco de dados de perguntas por categoria
        const challenges = {
            tobe: [
                { q: "Qual a forma correta para: 'He ___ a doctor.'", options: ["am", "is", "are"], correct: 1 },
                { q: "Complete a frase negativa: 'They ___ not happy.'", options: ["is", "am", "are"], correct: 2 },
                { q: "Forma interrogativa correta para: 'You are ready.'", options: ["Are you ready?", "Is you ready?", "Am you ready?"], correct: 0 }
            ],
            present: [
                { q: "Complete: 'She ___ English every day.'", options: ["study", "studies", "studying"], correct: 1 },
                { q: "Forma negativa de 'I like coffee':", options: ["I not like coffee", "I don't like coffee", "I doesn't like coffee"], correct: 1 },
                { q: "Complete: 'He ___ soccer on weekends.'", options: ["play", "plays", "playing"], correct: 1 }
            ],
            continuous: [
                { q: "Complete: 'They are ___ TV right now.'", options: ["watch", "watches", "watching"], correct: 2 },
                { q: "Qual frase está no Present Continuous?", options: ["I go to school.", "I am going to school.", "I went to school."], correct: 1 },
                { q: "Complete: 'She is ___ a book.'", options: ["read", "reading", "reads"], correct: 1 }
            ],
            past: [
                { q: "Qual o passado simples (Simple Past) do verbo 'go'?", options: ["goed", "gone", "went"], correct: 2 },
                { q: "Complete: 'I ___ a movie yesterday.'", options: ["watch", "watched", "watching"], correct: 1 },
                { q: "Forma negativa no passado: 'He ___ work yesterday.'", options: ["didn't", "don't", "wasn't"], correct: 0 }
            ],
            pastcont: [
                { q: "Complete: 'I ___ sleeping when you called.'", options: ["was", "were", "is"], correct: 0 },
                { q: "Complete: 'They ___ playing soccer at 8 PM.'", options: ["was", "were", "are"], correct: 1 },
                { q: "Tradução de 'We were eating':", options: ["Nós comemos", "Nós estávamos comendo", "Nós comeremos"], correct: 1 }
            ],
            vocab: [
                { q: "O que significa a palavra 'Library'?", options: ["Livraria", "Biblioteca", "Laboratório"], correct: 1 },
                { q: "Qual o significado de 'Expensive'?", options: ["Extensivo", "Barato", "Caro"], correct: 2 },
                { q: "Como se diz 'Acelerar / Em frente' ou 'Prédio' em inglês? (Building)", options: ["Construção / Prédio", "Chuva", "Ponte"], correct: 0 }
            ]
        };

        const tileTypes = [
            { name: "START", cat: "start", label: "START" },
            { name: "Verbo To Be", cat: "tobe", label: "To Be" },
            { name: "Simple Present", cat: "present", label: "Present" },
            { name: "Vocabulário", cat: "vocab", label: "Vocab" },
            { name: "Present Continuous", cat: "continuous", label: "Continuous" },
            { name: "Simple Past", cat: "past", label: "Past" },
            { name: "Past Continuous", cat: "pastcont", label: "Past Cont." },
            { name: "Vocabulário", cat: "vocab", label: "Vocab" },
            { name: "Verbo To Be", cat: "tobe", label: "To Be" },
            { name: "Simple Present", cat: "present", label: "Present" },
            { name: "Safe Zone", cat: "start", label: "Safe Zone" },
            { name: "Present Continuous", cat: "continuous", label: "Continuous" },
            { name: "Simple Past", cat: "past", label: "Past" },
            { name: "Vocabulário", cat: "vocab", label: "Vocab" },
            { name: "Past Continuous", cat: "pastcont", label: "Past Cont." },
            { name: "Verbo To Be", cat: "tobe", label: "To Be" },
            { name: "Simple Present", cat: "present", label: "Present" },
            { name: "Vocabulário", cat: "vocab", label: "Vocab" },
            { name: "Present Continuous", cat: "continuous", label: "Continuous" },
            { name: "Simple Past", cat: "past", label: "Past" },
            { name: "Past Continuous", cat: "pastcont", label: "Past Cont." },
            { name: "Verbo To Be", cat: "tobe", label: "To Be" },
            { name: "Vocabulário", cat: "vocab", label: "Vocab" },
            { name: "FINISH", cat: "finish", label: "FINISH" }
        ];

        let currentPosition = 0;
        let pawnElement;

        // Inicializar o Tabuleiro
        function createBoard() {
            const board = document.getElementById('board');
            
            tileTypes.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.className = `tile cat-${tile.cat}`;
                tileDiv.style.gridRow = tileCoords[index].r;
                tileDiv.style.gridColumn = tileCoords[index].c;
                tileDiv.id = `tile-${index}`;

                tileDiv.innerHTML = `
                    <span class="tile-number">${index + 1}</span>
                    <span>${tile.label}</span>
                `;
                board.appendChild(tileDiv);
            });

            // Criar o peão
            pawnElement = document.createElement('div');
            pawnElement.className = 'pawn';
            pawnElement.id = 'pawn';
            pawnElement.innerText = 'P1';
            board.appendChild(pawnElement);

            updatePawnPosition();
        }

        function updatePawnPosition() {
            const targetTile = document.getElementById(`tile-${currentPosition}`);
            if (targetTile) {
                // Posicionar o peão exatamente em cima da casinha correspondente
                pawnElement.style.top = (targetTile.offsetTop + 15) + 'px';
                pawnElement.style.left = (targetTile.offsetLeft + 15) + 'px';
            }
        }

        // Função para rolar o dado
        function rollDice() {
            const diceEl = document.getElementById('dice');
            const resultText = document.getElementById('dice-result');
            
            // Efeito visual de rolagem rápida
            let rolls = 0;
            const rollInterval = setInterval(() => {
                const randomTemp = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = randomTemp;
                rolls++;
                if (rolls > 10) {
                    clearInterval(rollInterval);
                    const finalRoll = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = finalRoll;
                    resultText.innerText = `Você tirou o número: ${finalRoll}`;
                    
                    movePawn(finalRoll);
                }
            }, 50);
        }

        // Mover o peão
        function movePawn(steps) {
            currentPosition += steps;
            if (currentPosition >= tileTypes.length) {
                currentPosition = tileTypes.length - 1;
                document.getElementById('board-status').innerText = "Parabéns! Você chegou ao FINISH!";
            } else {
                document.getElementById('board-status').innerText = `Peão moveu para a casinha ${currentPosition + 1}`;
            }
            updatePawnPosition();
            triggerChallenge(currentPosition);
        }

        // Disparar o desafio da casinha
        function triggerChallenge(pos) {
            const tile = tileTypes[pos];
            const qText = document.getElementById('question-text');
            const optionsList = document.getElementById('options-list');
            const feedbackText = document.getElementById('feedback-text');
            
            optionsList.innerHTML = '';
            feedbackText.innerText = '';

            if (tile.cat === 'start' || tile.cat === 'finish') {
                qText.innerText = `Você parou na casinha de ${tile.name}! Relaxe e aproveite a rodada.`;
                return;
            }

            const categoryPool = challenges[tile.cat];
            const randomChallenge = categoryPool[Math.floor(Math.random() * categoryPool.length)];

            qText.innerText = `[${tile.name}] ${randomChallenge.q}`;

            randomChallenge.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, idx, randomChallenge.correct);
                optionsList.appendChild(btn);
            });
        }

        // Checar resposta
        function checkAnswer(btn, selected, correct) {
            const options = document.querySelectorAll('.option-btn');
            options.forEach((b, idx) => {
                b.disabled = true;
                if (idx === correct) b.classList.add('correct');
                else if (idx === selected) b.classList.add('wrong');
            });

            const feedbackText = document.getElementById('feedback-text');
            if (selected === correct) {
                feedbackText.style.color = '#4ade80';
                feedbackText.innerText = 'Correto! Muito bem!';
            } else {
                feedbackText.style.color = '#f87171';
                feedbackText.innerText = 'Incorreto! Tente novamente na próxima rodada.';
            }
        }

        // Inicializar ao carregar a página
        window.onload = createBoard;
        window.onresize = updatePawnPosition;
    </script>
</body>
</html>
