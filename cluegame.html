* {

.game {

}

h1 {

.subtitle {
    margin: 0;
    color: #555;
}

/* TOP BAR */

.topbar {
    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    justify-content: center;

    margin: 18px 0;
}

button {
    border: 2px solid #111;

    background: #fff;
    color: #111;

    border-radius: 10px;

    padding: 12px 20px;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 4px 4px 0 #111;
}

button:active {
    transform: translateY(1px);
    box-shadow: none;
}

button:disabled {
    opacity: .45;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}

.primary {
    background: #111;
    color: #fff;
}

/* COUNTER */

.counter {
    text-align: center;

    font-weight: 800;

    margin: 10px 0 20px;
}

.counter span {
    background: #fff;

    border: 2px solid #111;

    border-radius: 999px;

    padding: 7px 16px;
}

/* GAME AREA */

.deck-area {
    display: flex;
    justify-content: center;

    min-height: 520px;
}

/* CARD */

.card {
    width: min(650px, 94vw);

    min-height: 490px;

    background: #fff;

    border: 3px solid #111;

    border-radius: 18px;

    box-shadow: 7px 7px 0 #111;

    padding: 20px;

    display: flex;
    flex-direction: column;

    animation: appear .25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

/* CARD HEADER */

.card-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    font-weight: 800;

    font-size: 18px;

    padding-bottom: 12px;

    border-bottom: 3px solid #111;
}

.card-number {
    font-size: 13px;
    color: #666;
}

/* CLUES */

.clues {
    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 20px;
}

.clue {
    border: 2px solid #111;

    border-radius: 12px;

    padding: 16px;

    background: #f7f7f7;

    font-size: 18px;

    line-height: 1.4;
}

.clue-title {
    display: block;

    font-size: 13px;

    font-weight: 900;

    margin-bottom: 5px;

    color: #555;
}

/* HIDDEN CLUES */

.hidden {
    display: none;
}

/* ACTION BUTTONS */

.actions {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 20px;
}

/* ANSWER */

.answer-box {
    display: none;

    margin-top: 18px;

    padding: 18px;

    border: 3px solid #111;

    border-radius: 14px;

    text-align: center;

    background: #e8e8e8;
}

.answer-title {
    font-size: 13px;

    font-weight: 900;

    color: #555;

    margin-bottom: 10px;
}

.answer-input {
    width: 100%;

    max-width: 450px;

    padding: 14px;

    border: 2px solid #111;

    border-radius: 10px;

    background: #fff;

    color: #111;

    text-align: center;

    font-size: clamp(25px, 6vw, 42px);

    font-weight: 900;

    outline: none;
}

/* NEXT */

.next-area {
    display: none;

    justify-content: center;

    margin-top: 15px;
}

.next-area button {
    width: 100%;

    max-width: 300px;
}

/* EMPTY */

.empty {
    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    min-height: 490px;

    border: 3px dashed #111;

    border-radius: 18px;

    padding: 30px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    }

    }

    }

        padding: 14px;
    }

    .topbar button {
        flex: 1 1 120px;
    }

}

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        const temp = result[i];

        result[i] = result[j];

        result[j] = temp;
    }

    return result;
}

    const clue3 =
        document.getElementById("clue3");

    const clue3Btn =
        document.getElementById("clue3Btn");


    clue3.classList.remove("hidden");

    clue3Btn.disabled = true;
}


/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer() {

    if (!currentCard) {
        return;
    }


    const answerBox =
        document.getElementById("answerBox");

    const nextArea =
        document.getElementById("nextArea");


    if (!answerBox) {
        return;
    }


    answerBox.style.display = "block";

    nextArea.style.display = "flex";
}


/* =====================================================
   HIDE ANSWER
===================================================== */

function hideAnswer() {

    const answerBox =
        document.getElementById("answerBox");


    if (!answerBox) {
        return;
    }


    answerBox.style.display = "none";
}


/* =====================================================
   SKIP
===================================================== */

function skipCard() {

    if (!currentCard) {
        return;
    }


    currentCard = null;


    if (deck.length === 0) {

        updateCounter();

        showComplete();

        return;
    }


    updateCounter();

    showReady();
}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleDeck() {

    deck = shuffle(deck);

    updateCounter();


    if (deck.length > 0) {

        showReady();

    } else {

        showComplete();

    }
}


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    deck = shuffle(originalCards);

    currentCard = null;

    cardsPlayed = 0;

    updateCounter();

    showReady();
}


/* =====================================================
   COMPLETE
===================================================== */

function showComplete() {

    currentCard = null;

    startBtn.disabled = true;

    skipBtn.disabled = true;

    showAnswerBtn.disabled = true;


    deckArea.innerHTML = `

        <div class="empty">

            <div>

                <h2>🎉 DECK COMPLETE!</h2>

                <p>
                    You played
                    <b>${cardsPlayed}</b>
                    cards.
                </p>

                <p>
                    No card was repeated.
                </p>


                <button
                    id="playAgainBtn"
                    class="primary">

                    ↺ PLAY AGAIN

                </button>

            </div>

        </div>

    `;


    document
        .getElementById("playAgainBtn")
        .addEventListener(
            "click",
            resetGame
        );
}


/* =====================================================
   BUTTONS
===================================================== */

startBtn.addEventListener(
    "click",
    startCard
);


skipBtn.addEventListener(
    "click",
    skipCard
);


showAnswerBtn.addEventListener(
    "click",
    showAnswer
);


shuffleBtn.addEventListener(
    "click",
    shuffleDeck
);


resetBtn.addEventListener(
    "click",
    resetGame
);


/* =====================================================
   INITIALIZE
===================================================== */

resetGame();

</script>

</body>
</html>
