<title>3 Clues - English Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 22px;

    font-family: Arial, sans-serif;

    background: #f4f4f2;
    color: #111;

    display: flex;
    justify-content: center;
}

.game {
    width: min(1000px, 100%);
}

header {
    padding:22px;
    text-align: center;
    margin-bottom: 18px;
}

h1 {
    margin: 0 0 6px;
    font-size: clamp(30px, 6vw, 52px);
}

.subtitle {
    margin: 0;
    color: #555;
}

/* TOP BAR */

.topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 18px 0;
}

button {
    border: 2px solid #111;
    background: #fff;
    color: #111;

    border-radius: 10px;

    padding: 12px 20px;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 4px 4px 0 #111;
}

button:active {
    transform: translateY(1px);
    box-shadow: none;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.primary {
    background: #111;
    color: #fff;
}

/* COUNTER */

.counter {
    text-align: center;
    font-weight: 800;
    margin: 10px 0 20px;
}

.counter span {
    background: #fff;
    border: 2px solid #111;
    border-radius: 999px;
    padding: 7px 16px;
}

/* GAME AREA */

.deck-area {
    display: flex;
    justify-content: center;
    min-height: 520px;
}

/* CARD */

.card {
    width: min(650px, 94vw);
    min-height: 490px;

    background: #fff;

    border: 3px solid #111;
    border-radius: 18px;

    box-shadow: 7px 7px 0 #111;

    padding: 20px;

    display: flex;
    flex-direction: column;

    animation: appear .25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

/* CARD TOP */

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-weight: 800;
    font-size: 18px;

    padding-bottom: 12px;

    border-bottom: 3px solid #111;
}

.card-number {
    font-size: 13px;
    color: #666;
}

/* CLUES */

.clues {
    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 20px;
}

.clue {
    border: 2px solid #111;

    border-radius: 12px;

    padding: 16px;

    background: #f7f7f7;

    font-size: 18px;

    line-height: 1.4;
}

.clue-title {
    display: block;

    font-size: 13px;

    font-weight: 900;

    margin-bottom: 5px;

    color: #555;
}

.hidden {
    display: none;
}

/* ACTIONS */

.actions {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 20px;
}

/* ANSWER */

.answer-box {
    display: none;

    margin-top: 18px;

    padding: 18px;

    border: 3px solid #111;

    border-radius: 14px;

    text-align: center;

    background: #e8e8e8;
}

.answer-title {
    font-size: 13px;

    font-weight: 900;

    color: #555;

    margin-bottom: 10px;
}

.answer-input {
    width: 100%;

    max-width: 450px;

    padding: 14px;

    border: 2px solid #111;

    border-radius: 10px;

    background: #fff;

    color: #111;

    text-align: center;

    font-size: clamp(25px, 6vw, 42px);

    font-weight: 900;

    outline: none;
}

.answer-buttons {
    display: flex;

    justify-content: center;

    margin-top: 12px;
}

/* NEXT */

.next-area {
    display: none;

    justify-content: center;

    margin-top: 15px;
}

.next-area button {
    width: 100%;
    max-width: 300px;
}

/* EMPTY */

.empty {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    width: min(650px, 94vw);

    min-height: 490px;

    background: #fff;

    border: 3px dashed #111;

    border-radius: 18px;

    padding: 30px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .card {
        min-height: auto;

        padding: 15px;

        box-shadow: 5px 5px 0 #111;
    }

    .deck-area {
        min-height: 430px;
    }

    .card-top {
        font-size: 15px;
    }

    .clue {
        font-size: 16px;
        padding: 14px;
    }

    .topbar button {
        flex: 1 1 120px;
    }

}

</style>
</head>

/* =====================================================
   GAME VARIABLES
===================================================== */

let deck = [];

let currentCard = null;

let cardsPlayed = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const deckArea =
    document.getElementById("deckArea");

const remaining =
    document.getElementById("remaining");

const startBtn =
    document.getElementById("startBtn");

    document.getElementById("skipBtn");

    document.getElementById("showAnswerBtn");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const resetBtn =
    document.getElementById("resetBtn");


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        const temp = result[i];

        result[i] = result[j];

        result[j] = temp;
    }

    return result;
}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter() {

    remaining.textContent =
        deck.length;

}


/* =====================================================
   READY SCREEN
===================================================== */

function showReady() {

    deckArea.innerHTML = `

        <div class="empty">

            <div>

                <h2>🎭 Ready?</h2>

                <p>
                    Click <b>START CARD</b> to begin.
                </p>

                <p>
                    <b>${deck.length}</b>
                    cards remaining.
                </p>

                <p>
                    Guess the word or action!
                </p>

            </div>

        </div>

    `;

    startBtn.disabled = false;

    skipBtn.disabled = true;

    showAnswerBtn.disabled = true;
}


/* =====================================================
   START CARD
===================================================== */

function startCard() {

    if (deck.length === 0) {

        showComplete();

        return;
    }

    currentCard =
        deck.shift();

    cardsPlayed++;

    renderCard();

    updateCounter();

    startBtn.disabled = true;

    skipBtn.disabled = false;

    showAnswerBtn.disabled = false;
}


/* =====================================================
   RENDER CARD
===================================================== */

                        CLUE 3

                    ${currentCard.clues[2]}

            <div class="actions">

                <button id="clue2Btn">

                <button

                    </button>

                </div>

            </div>


            <div
                id="nextArea"
                class="next-area">

                <button
                    id="nextBtn"
                    class="primary">

                    ➡️ NEXT CARD

                </button>

            </div>

        </article>

    `;


    document
        .getElementById("clue2Btn")
        .addEventListener(
            "click",
            revealClue2
        );


    document
        .getElementById("clue3Btn")
        .addEventListener(
            "click",
            revealClue3
        );


    document
        .getElementById("hideAnswerBtn")
        .addEventListener(
            "click",
            hideAnswer
        );


    document
        .getElementById("nextBtn")
        .addEventListener(
            "click",
            startCard
        );

}

/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer() {

    if (!currentCard) {
        return;
    }


    const answerBox =
        document.getElementById("answerBox");

    const nextArea =
        document.getElementById("nextArea");


    if (!answerBox) {
        return;
    }


    answerBox.style.display =
        "block";

    nextArea.style.display =
        "flex";
}


/* =====================================================
   HIDE ANSWER
===================================================== */

function hideAnswer() {

    const answerBox =
        document.getElementById("answerBox");


    if (!answerBox) {
        return;
    }


    answerBox.style.display =
        "none";
}


/* =====================================================
   SKIP
===================================================== */

function skipCard() {

    if (!currentCard) {
        return;
    }


    currentCard = null;


    if (deck.length === 0) {

        updateCounter();

        showComplete();

        return;
    }


    updateCounter();

    showReady();
}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleDeck() {

    deck = shuffle(deck);

    updateCounter();


    if (deck.length > 0) {

        showReady();

    } else {

        showComplete();

    }
}
