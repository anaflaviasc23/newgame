<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plural Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: #f4f4f2;
    color: #111;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   GAME CARD
========================= */

.game {
    width: 100%;
    max-width: 950px;

    background: white;

    border: 3px solid #111;
    border-radius: 18px;

    box-shadow: 8px 8px 0 #111;

    padding: 35px;

    text-align: center;

    position: relative;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

    flex-wrap: wrap;
}

.title {
    text-align: left;
}

.title h1 {
    margin: 0;

    font-size: 30px;

    font-weight: 900;
}

.title p {
    margin: 6px 0 0;

    color: #555;

    font-size: 14px;
}


/* =========================
   HUD
========================= */

.hud {
    display: flex;
    gap: 10px;
}

.hud-box {
    border: 2px solid #111;

    border-radius: 10px;

    padding: 9px 15px;

    min-width: 100px;

    text-align: center;
}

.hud-label {
    display: block;

    font-size: 11px;

    font-weight: bold;

    margin-bottom: 3px;
}

.hud-value {
    font-size: 20px;

    font-weight: 900;
}


/* =========================
   INSTRUCTION
========================= */

.instruction {
    display: inline-block;

    background: #111;
    color: white;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 14px;

    font-weight: 900;

    margin-bottom: 15px;
}


/* =========================
   WORD
========================= */

.word-area {
    border: 3px dashed #111;

    border-radius: 14px;

    padding: 25px;

    margin-bottom: 25px;

    background: #fafafa;
}

.word-label {
    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #555;

    margin-bottom: 8px;
}

.word {
    font-size: 48px;

    font-weight: 900;

    margin: 5px 0;
}


/* =========================
   OPTIONS
========================= */

.options-label {
    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #555;

    margin-bottom: 15px;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 12px;

    margin-bottom: 10px;
}


/* =========================
   ANSWER BUTTONS
========================= */

.btn {
    border: 3px solid #111;

    background: white;

    color: #111;

    padding: 17px 10px;

    min-height: 60px;

    border-radius: 10px;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    transition: .15s;

    display: flex;

    justify-content: center;

    align-items: center;
}

.btn:hover {
    transform: translateY(-3px);

    box-shadow: 4px 4px 0 #111;
}

.btn:active {
    transform: translateY(1px);

    box-shadow: none;
}


/* CORRECT */

.correct {
    background: #111 !important;

    color: white !important;
}


/* WRONG */

.wrong {
    background: #111 !important;

    color: white !important;
}


/* =========================
   COLORS
========================= */

.c1 { background: #f4e9ff; }
.c2 { background: #fff0df; }
.c3 { background: #e5f2ff; }
.c4 { background: #f1e8ff; }
.c5 { background: #fff4d9; }

.c6 { background: #e2f8f2; }
.c7 { background: #e9edf2; }
.c8 { background: #e4f7e9; }
.c9 { background: #e2f5f1; }
.c10 { background: #e3effa; }


/* =========================
   GAME OVER OVERLAY
========================= */

.overlay {
    position: absolute;

    inset: 0;

    background: rgba(0,0,0,0.88);

    color: white;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    border-radius: 15px;

    z-index: 10;

    padding: 20px;
}

.overlay h1 {
    margin: 0 0 10px;

    font-size: 34px;
}

.overlay p {
    margin: 0;

    font-size: 18px;
}

.overlay button {
    margin-top: 25px;

    padding: 13px 25px;

    border: 3px solid white;

    background: white;

    color: #111;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;

    border-radius: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .game {
        padding: 22px;
    }

    .header {
        justify-content: center;
    }

    .title {
        text-align: center;

        width: 100%;
    }

    .title h1 {
        font-size: 24px;
    }

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .word {
        font-size: 38px;
    }

    .hud {
        width: 100%;

        justify-content: center;
    }

}

@media (max-width: 400px) {

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .btn {
        font-size: 14px;

        padding: 13px 7px;
    }

}

</style>
</head>


<body>


<div class="game">


    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <h1>PLURAL GAME</h1>

            <p>
                Choose the correct plural form.
            </p>

        </div>


        <div class="hud">

            <div class="hud-box">

                <span class="hud-label">
                    LIVES
                </span>

                <span
                    class="hud-value"
                    id="lives"
                >
                    ❤️❤️❤️
                </span>

            </div>


            <div class="hud-box">

                <span class="hud-label">
                    SCORE
                </span>

                <span
                    class="hud-value"
                    id="score"
                >
                    0
                </span>

            </div>

        </div>

    </div>


    <!-- INSTRUCTION -->

    <div class="instruction">

        CHOOSE THE CORRECT PLURAL

    </div>


    <!-- WORD -->

    <div class="word-area">

        <div class="word-label">
            SINGULAR
        </div>

        <div
            class="word"
            id="word"
        ></div>

    </div>


    <!-- OPTIONS -->

    <div class="options-label">

        PLURAL OPTIONS

    </div>


    <div
        class="grid"
        id="grid"
    ></div>


    <!-- GAME OVER -->

    <div
        class="overlay"
        id="gameOver"
    >

        <h1>
            You lose 😢
        </h1>

        <p>
            Final score:
            <strong id="finalScore">0</strong>
        </p>

        <button
            onclick="restartGame()"
        >
            RESTART
        </button>

    </div>


</div>


<!-- SONS -->

<audio
    id="correctSound"
    src="https://www.soundjay.com/buttons/sounds/button-4.mp3"
></audio>

<audio
    id="wrongSound"
    src="https://www.soundjay.com/buttons/sounds/button-10.mp3"
></audio>


<script>


const grid =
    document.getElementById("grid");

const wordEl =
    document.getElementById("word");

const livesEl =
    document.getElementById("lives");

const scoreEl =
    document.getElementById("score");

const finalScore =
    document.getElementById("finalScore");

const gameOver =
    document.getElementById("gameOver");

const correctSound =
    document.getElementById("correctSound");

const wrongSound =
    document.getElementById("wrongSound");


let score = 0;

let lives = 3;

let correctAnswer;


/* =========================
   WORDS
========================= */

const words = {

Apple:"Apples",
Baby:"Babies",
Battery:"Batteries",
Bird:"Birds",
Book:"Books",
Box:"Boxes",
Boy:"Boys",
Brush:"Brushes",
Bus:"Buses",
Butterfly:"Butterflies",
Candy:"Candies",
Cherry:"Cherries",
Child:"Children",
Church:"Churches",
City:"Cities",
Country:"Countries",
Cup:"Cups",
Dog:"Dogs",
Dress:"Dresses",
Egg:"Eggs",
Family:"Families",
Fish:"Fish",
Fly:"Flies",
Foot:"Feet",
Fox:"Foxes",
Garage:"Garages",
Girl:"Girls",
Glass:"Glasses",
Goose:"Geese",
Hallway:"Hallways",
Hero:"Heroes",
House:"Houses",
Knife:"Knives",
Lady:"Ladies",
Leaf:"Leaves",
Life:"Lives",
Man:"Men",
Mango:"Mangoes",
Match:"Matches",
Mattress:"Mattresses",
Mouse:"Mice",
Person:"People",
Potato:"Potatoes",
Quiz:"Quizzes",
Roof:"Roofs",
Sandwich:"Sandwiches",
Secretary:"Secretaries",
Shoe:"Shoes",
Sister:"Sisters",
Snake:"Snakes",
Tomato:"Tomatoes",
Tooth:"Teeth",
Toy:"Toys",
Watch:"Watches",
Way:"Ways",
Wife:"Wives",
Window:"Windows",
Witch:"Witches",
Wizard:"Wizards",
Woman:"Women"

};


/* =========================
   HUD
========================= */

function updateHUD() {

    livesEl.innerText =
        "❤️".repeat(lives);

    scoreEl.innerText =
        score;

}


/* =========================
   WRONG ANSWERS
========================= */

function generateWrong(word) {

    let errors = [];

    errors.push(
        word + "s"
    );

    errors.push(
        word + "es"
    );


    if (
        word.endsWith("y")
    ) {

        errors.push(
            word.replace(
                "y",
                "ys"
            )
        );

    }


    if (
        word.endsWith("f") ||
        word.endsWith("fe")
    ) {

        errors.push(
            word
                .replace(
                    "f",
                    "fs"
                )
                .replace(
                    "fe",
                    "fes"
                )
        );

    }


    return [
        ...new Set(errors)
    ];

}


/* =========================
   NEW ROUND
========================= */

function newRound() {

    const keys =
        Object.keys(words);


    const word =
        keys[
            Math.floor(
                Math.random() *
                keys.length
            )
        ];


    correctAnswer =
        words[word];


    wordEl.textContent =
        word;


    let options = [
        correctAnswer
    ];


    let wrongs =
        generateWrong(word);


    wrongs.forEach(
        w => {

            if (
                !options.includes(w) &&
                options.length < 10
            ) {

                options.push(w);

            }

        }
    );


    while (
        options.length < 10
    ) {

        let rand =
            words[
                keys[
                    Math.floor(
                        Math.random() *
                        keys.length
                    )
                ]
            ];


        if (
            !options.includes(rand)
        ) {

            options.push(rand);

        }

    }


    options =
        options.sort(
            () => Math.random() - 0.5
        );


    grid.innerHTML = "";


    options.forEach(
        (opt, i) => {

            const btn =
                document.createElement(
                    "div"
                );


            btn.className =
                "btn c" +
                ((i % 10) + 1);


            btn.textContent =
                opt;


            btn.onclick =
                () => check(
                    btn,
                    opt
                );


            grid.appendChild(
                btn
            );

        }
    );

}


/* =========================
   CHECK
========================= */

function check(
    btn,
    opt
) {

    /*
       CORRECT
    */

    if (
        opt === correctAnswer
    ) {

        btn.classList.add(
            "correct"
        );


        correctSound.currentTime = 0;

        correctSound.play().catch(
            () => {}
        );


        setTimeout(
            () => {

                score++;

                updateHUD();

                newRound();

            },
            400
        );

    }


    /*
       WRONG
    */

    else {

        btn.classList.add(
            "wrong"
        );


        wrongSound.currentTime = 0;

        wrongSound.play().catch(
            () => {}
        );


        setTimeout(
            () => {

                lives--;

                updateHUD();


                if (
                    lives <= 0
                ) {

                    finalScore.innerText =
                        score;

                    gameOver.style.display =
                        "flex";

                }

                else {

                    newRound();

                }

            },
            400
        );

    }

}


/* =========================
   RESTART
========================= */

function restartGame() {

    score = 0;

    lives = 3;


    updateHUD();


    gameOver.style.display =
        "none";


    newRound();

}


/* =========================
   START
========================= */

updateHUD();

newRound();


</script>

</body>
</html>
