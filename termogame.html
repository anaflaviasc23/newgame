<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Word Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: #f4f4f2;
    color: #111;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game {
    width: min(650px, 100%);
    text-align: center;
}

/* =====================================================
   HEADER
===================================================== */

header {
    margin-bottom: 20px;
}

h1 {
    margin: 0;

    font-size: clamp(32px, 7vw, 52px);
    font-weight: 800;

    letter-spacing: 1px;
}

.subtitle {
    margin-top: 7px;

    font-size: 15px;

    color: #555;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    margin-bottom: 18px;

    flex-wrap: wrap;
}

.info {
    border: 2px solid #111;

    background: white;

    border-radius: 10px;

    padding: 8px 14px;

    font-size: 14px;

    font-weight: bold;
}

.new-game {
    border: 2px solid #111;

    background: white;

    border-radius: 10px;

    padding: 9px 15px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s;
}

.new-game:hover {
    background: #111;
    color: white;
}

/* =====================================================
   BOARD
===================================================== */

.board {
    width: min(350px, 100%);

    margin: 0 auto 22px;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 7px;
}

.tile {
    aspect-ratio: 1 / 1;

    border: 2px solid #b8b8b5;

    background: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(24px, 7vw, 34px);

    font-weight: 800;

    text-transform: uppercase;

    border-radius: 4px;

    transition:
        transform 0.15s,
        background 0.2s,
        border 0.2s;
}

.tile.filled {
    border-color: #555;
}

.tile.pop {
    transform: scale(1.05);
}

.tile.correct {
    background: #6aaa64;

    border-color: #6aaa64;

    color: white;
}

.tile.present {
    background: #c9b458;

    border-color: #c9b458;

    color: white;
}

.tile.absent {
    background: #787c7e;

    border-color: #787c7e;

    color: white;
}

/* =====================================================
   MESSAGE
===================================================== */

.message {
    min-height: 28px;

    margin-bottom: 15px;

    font-size: 16px;

    font-weight: bold;
}

.message.success {
    color: #397a35;
}

.message.error {
    color: #a32626;
}

.message.loading {
    color: #555;
}

/* =====================================================
   KEYBOARD
===================================================== */

.keyboard {
    width: 100%;

    max-width: 600px;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    gap: 7px;
}

.keyboard-row {
    display: flex;

    justify-content: center;

    gap: 5px;
}

.key {
    min-width: 38px;

    height: 52px;

    border: 2px solid #111;

    border-radius: 7px;

    background: white;

    font-size: 14px;

    font-weight: 800;

    padding: 0 8px;

    cursor: pointer;

    transition:
        background 0.15s,
        color 0.15s,
        transform 0.1s;
}

.key:hover {
    transform: translateY(-1px);
}

.key:active {
    transform: scale(0.95);
}

.key.wide {
    min-width: 65px;

    font-size: 12px;
}

.key.correct {
    background: #6aaa64;

    border-color: #6aaa64;

    color: white;
}

.key.present {
    background: #c9b458;

    border-color: #c9b458;

    color: white;
}

.key.absent {
    background: #787c7e;

    border-color: #787c7e;

    color: white;
}

/* =====================================================
   INSTRUCTIONS
===================================================== */

.instructions {
    margin-top: 20px;

    padding: 13px 15px;

    border: 2px solid #111;

    border-radius: 10px;

    background: white;

    font-size: 13px;

    line-height: 1.5;
}

.legend {
    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-top: 8px;
}

.legend-item {
    display: flex;

    align-items: center;

    gap: 5px;
}

.legend-box {
    width: 18px;
    height: 18px;

    border-radius: 3px;

    border: 1px solid #555;
}

.legend-green {
    background: #6aaa64;
}

.legend-yellow {
    background: #c9b458;
}

.legend-gray {
    background: #787c7e;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 12px;

        align-items: flex-start;
    }

    .game {
        padding-top: 10px;
    }

    .keyboard {
        gap: 5px;
    }

    .keyboard-row {
        gap: 3px;
    }

    .key {
        min-width: 0;

        width: 9%;

        height: 48px;

        padding: 0;

        font-size: 12px;
    }

    .key.wide {
        width: 14%;

        min-width: 0;

        font-size: 10px;
    }

    .board {
        gap: 5px;
    }
}

</style>

</head>

<body>

<div class="game">

    <header>

        <h1>WORD GAME</h1>

        <div class="subtitle">
            Guess the 5-letter English word!
        </div>

    </header>


    <div class="topbar">

        <div class="info">
            Attempts:
            <span id="attempts">0</span>/6
        </div>

        <button
            class="new-game"
            id="newGame"
            type="button">

            New Game

        </button>

    </div>


    <div
        id="board"
        class="board">
    </div>


    <div
        id="message"
        class="message">

        Start guessing!

    </div>


    <div
        id="keyboard"
        class="keyboard">
    </div>


    <div class="instructions">

        <strong>How to play</strong>

        <br>

        Guess the hidden 5-letter English word
        in 6 attempts.

        <div class="legend">

            <div class="legend-item">

                <span
                    class="legend-box legend-green">
                </span>

                Correct

            </div>


            <div class="legend-item">

                <span
                    class="legend-box legend-yellow">
                </span>

                Wrong position

            </div>


            <div class="legend-item">

                <span
                    class="legend-box legend-gray">
                </span>

                Not in word

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SECRET WORDS
=====================================================

   These are the words the game can choose.

   The player, however, can enter ANY valid
   English 5-letter word.

===================================================== */

const SECRET_WORDS = [

    "about",
    "after",
    "again",
    "apple",
    "beach",
    "black",
    "bread",
    "bring",
    "brown",
    "chair",
    "class",
    "clean",
    "close",
    "cloud",
    "dance",
    "dream",
    "drink",
    "drive",
    "early",
    "earth",
    "eight",
    "every",
    "family",
    "field",
    "first",
    "floor",
    "food",
    "friend",
    "front",
    "fruit",
    "green",
    "happy",
    "heart",
    "house",
    "juice",
    "large",
    "learn",
    "light",
    "lunch",
    "music",
    "night",
    "ocean",
    "party",
    "phone",
    "place",
    "plant",
    "queen",
    "quick",
    "quiet",
    "right",
    "river",
    "school",
    "seven",
    "shirt",
    "short",
    "sleep",
    "small",
    "smile",
    "snake",
    "sound",
    "sport",
    "start",
    "street",
    "study",
    "table",
    "teach",
    "thank",
    "thing",
    "three",
    "today",
    "train",
    "travel",
    "treat",
    "under",
    "water",
    "white",
    "woman",
    "world",
    "write",
    "young",
    "zebra"

];


/* =====================================================
   GAME SETTINGS
===================================================== */

const MAX_ATTEMPTS = 6;

const WORD_LENGTH = 5;


/* =====================================================
   GAME VARIABLES
===================================================== */

let answer = "";

let currentRow = 0;

let currentGuess = "";

let gameOver = false;

let checkingWord = false;


/* =====================================================
   DOM
===================================================== */

const board =
    document.getElementById("board");

const keyboard =
    document.getElementById("keyboard");

const message =
    document.getElementById("message");

const attemptsDisplay =
    document.getElementById("attempts");

const newGameButton =
    document.getElementById("newGame");


/* =====================================================
   KEYBOARD
===================================================== */

const keyboardRows = [

    [
        "Q",
        "W",
        "E",
        "R",
        "T",
        "Y",
        "U",
        "I",
        "O",
        "P"
    ],

    [
        "A",
        "S",
        "D",
        "F",
        "G",
        "H",
        "J",
        "K",
        "L"
    ],

    [
        "ENTER",
        "Z",
        "X",
        "C",
        "V",
        "B",
        "N",
        "M",
        "BACK"
    ]

];


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    answer =
        SECRET_WORDS[
            Math.floor(
                Math.random() *
                SECRET_WORDS.length
            )
        ];

    currentRow = 0;

    currentGuess = "";

    gameOver = false;

    checkingWord = false;

    attemptsDisplay.textContent = "0";

    showMessage(
        "Start guessing!",
        ""
    );

    createBoard();

    createKeyboard();

}


/* =====================================================
   CREATE BOARD
===================================================== */

function createBoard() {

    board.innerHTML = "";

    for (
        let i = 0;
        i < MAX_ATTEMPTS * WORD_LENGTH;
        i++
    ) {

        const tile =
            document.createElement("div");

        tile.className = "tile";

        board.appendChild(tile);
    }

}


/* =====================================================
   CREATE KEYBOARD
===================================================== */

function createKeyboard() {

    keyboard.innerHTML = "";

    keyboardRows.forEach(row => {

        const rowElement =
            document.createElement("div");

        rowElement.className =
            "keyboard-row";

        row.forEach(letter => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className = "key";

            button.dataset.key = letter;

            if (letter === "BACK") {

                button.textContent = "⌫";

                button.classList.add("wide");

            }

            else if (letter === "ENTER") {

                button.textContent = "ENTER";

                button.classList.add("wide");

            }

            else {

                button.textContent = letter;

            }

            button.addEventListener(
                "click",
                function() {

                    handleKey(letter);

                }
            );

            rowElement.appendChild(button);

        });

        keyboard.appendChild(rowElement);

    });

}


/* =====================================================
   HANDLE KEY
===================================================== */

function handleKey(key) {

    if (gameOver) {
        return;
    }

    if (checkingWord) {
        return;
    }

    if (key === "ENTER") {

        submitGuess();

        return;
    }

    if (key === "BACK") {

        deleteLetter();

        return;
    }

    if (/^[A-Z]$/.test(key)) {

        addLetter(
            key.toLowerCase()
        );

    }

}


/* =====================================================
   ADD LETTER
===================================================== */

function addLetter(letter) {

    if (
        currentGuess.length >=
        WORD_LENGTH
    ) {
        return;
    }

    currentGuess += letter;

    updateCurrentRow();

}


/* =====================================================
   DELETE LETTER
===================================================== */

function deleteLetter() {

    if (
        currentGuess.length === 0
    ) {
        return;
    }

    currentGuess =
        currentGuess.slice(
            0,
            -1
        );

    updateCurrentRow();

}


/* =====================================================
   UPDATE CURRENT ROW
===================================================== */

function updateCurrentRow() {

    const start =
        currentRow *
        WORD_LENGTH;

    for (
        let i = 0;
        i < WORD_LENGTH;
        i++
    ) {

        const tile =
            board.children[
                start + i
            ];

        tile.textContent =
            currentGuess[i]
                ? currentGuess[i].toUpperCase()
                : "";

        if (currentGuess[i]) {

            tile.classList.add(
                "filled"
            );

            tile.classList.add(
                "pop"
            );

            setTimeout(
                () => {

                    tile.classList.remove(
                        "pop"
                    );

                },
                120
            );

        }

        else {

            tile.classList.remove(
                "filled"
            );

        }

    }

}


/* =====================================================
   CHECK WORD WITH API
=====================================================

   API:
   Free Dictionary API

   Example:
   https://api.dictionaryapi.dev/api/v2/entries/en/house

   If the API finds a definition,
   the word is considered valid.

===================================================== */

async function isEnglishWord(word) {

    try {

        const response =
            await fetch(
                "https://api.dictionaryapi.dev/api/v2/entries/en/" +
                encodeURIComponent(word)
            );

        if (!response.ok) {

            return false;

        }

        const data =
            await response.json();

        return (
            Array.isArray(data) &&
            data.length > 0
        );

    }

    catch (error) {

        console.error(
            "Dictionary API error:",
            error
        );

        return null;

    }

}


/* =====================================================
   SUBMIT GUESS
===================================================== */

async function submitGuess() {

    if (
        currentGuess.length !==
        WORD_LENGTH
    ) {

        showMessage(
            "The word must have 5 letters.",
            "error"
        );

        return;
    }


    checkingWord = true;

    showMessage(
        "Checking word...",
        "loading"
    );


    const valid =
        await isEnglishWord(
            currentGuess
        );


    /*
       API FAILED
    */

    if (valid === null) {

        checkingWord = false;

        showMessage(
            "Dictionary unavailable. Check your internet connection.",
            "error"
        );

        return;
    }


    /*
       WORD NOT FOUND
    */

    if (!valid) {

        checkingWord = false;

        showMessage(
            `"${currentGuess.toUpperCase()}" is not recognized as an English word.`,
            "error"
        );

        return;
    }


    /*
       WORD VALID
    */

    evaluateGuess();

}


/* =====================================================
   EVALUATE GUESS
===================================================== */

function evaluateGuess() {

    const guess =
        currentGuess;

    const result =
        Array(
            WORD_LENGTH
        ).fill("absent");


    const answerLetters =
        answer.split("");


    /*
       FIRST PASS

       Correct letter
       Correct position
    */

    for (
        let i = 0;
        i < WORD_LENGTH;
        i++
    ) {

        if (
            guess[i] ===
            answer[i]
        ) {

            result[i] =
                "correct";

            answerLetters[i] =
                null;

        }

    }


    /*
       SECOND PASS

       Correct letter
       Wrong position
    */

    for (
        let i = 0;
        i < WORD_LENGTH;
        i++
    ) {

        if (
            result[i] ===
            "correct"
        ) {
            continue;
        }


        const index =
            answerLetters.indexOf(
                guess[i]
            );


        if (index !== -1) {

            result[i] =
                "present";

            answerLetters[index] =
                null;

        }

    }


    applyResult(result);

}


/* =====================================================
   APPLY RESULT
===================================================== */

function applyResult(result) {

    const start =
        currentRow *
        WORD_LENGTH;


    for (
        let i = 0;
        i < WORD_LENGTH;
        i++
    ) {

        const tile =
            board.children[
                start + i
            ];


        setTimeout(
            () => {

                tile.classList.add(
                    result[i]
                );

            },
            i * 120
        );


        updateKeyboard(
            currentGuess[i],
            result[i]
        );

    }


    setTimeout(
        () => {

            finishTurn();

        },
        WORD_LENGTH * 120 + 150
    );

}


/* =====================================================
   UPDATE KEYBOARD
===================================================== */

function updateKeyboard(
    letter,
    status
) {

    const key =
        document.querySelector(
            `.key[data-key="${letter.toUpperCase()}"]`
        );


    if (!key) {
        return;
    }


    /*
       CORRECT
       Highest priority
    */

    if (
        status === "correct"
    ) {

        key.classList.remove(
            "present",
            "absent"
        );

        key.classList.add(
            "correct"
        );

        return;
    }


    /*
       PRESENT
    */

    if (
        status === "present" &&
        !key.classList.contains(
            "correct"
        )
    ) {

        key.classList.remove(
            "absent"
        );

        key.classList.add(
            "present"
        );

        return;
    }


    /*
       ABSENT
    */

    if (
        status === "absent" &&
        !key.classList.contains(
            "correct"
        ) &&
        !key.classList.contains(
            "present"
        )
    ) {

        key.classList.add(
            "absent"
        );

    }

}


/* =====================================================
   FINISH TURN
===================================================== */

function finishTurn() {

    checkingWord = false;


    /*
       WIN
    */

    if (
        currentGuess ===
        answer
    ) {

        gameOver = true;

        const attempts =
            currentRow + 1;

        attemptsDisplay.textContent =
            attempts;

        showMessage(
            `🎉 Correct! The word was ${answer.toUpperCase()}.`,
            "success"
        );

        return;
    }


    /*
       NEXT ATTEMPT
    */

    currentRow++;

    attemptsDisplay.textContent =
        currentRow;


    /*
       GAME OVER
    */

    if (
        currentRow >=
        MAX_ATTEMPTS
    ) {

        gameOver = true;

        showMessage(
            `The word was ${answer.toUpperCase()}.`,
            "error"
        );

        return;
    }


    currentGuess = "";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message";

    if (type) {

        message.classList.add(
            type
        );

    }

}


/* =====================================================
   PHYSICAL KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (gameOver) {
            return;
        }

        const key =
            event.key.toUpperCase();


        if (key === "ENTER") {

            handleKey("ENTER");

            return;
        }


        if (
            event.key ===
            "Backspace"
        ) {

            handleKey("BACK");

            return;
        }


        if (
            /^[A-Z]$/.test(key)
        ) {

            handleKey(key);

        }

    }
);


/* =====================================================
   NEW GAME
===================================================== */

newGameButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   INITIALIZE
===================================================== */

startGame();

</script>

</body>
</html>
