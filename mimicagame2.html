<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pictionary - English Game</title>
<style>
*{
    box-sizing:border-box
}
body{
    margin:0;
    min-height:100vh;
    padding:22px;
    font-family:Arial,sans-serif;
    background:#f4f4f2;
    color:#111;
    display:flex;
    justify-content:center
}
.game{
    width:min(1000px,100%)
}
header{
    text-align:center;
    margin-bottom:18px
}
h1{
    margin:0 0 6px;
    font-size:clamp(30px,6vw,52px)
}
.subtitle{
    margin:0;
    color:#555
}
.topbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:18px 0
}
button{
    border:2px solid #111;
    background:#fff;
    color:#111;
    border-radius:10px;
    padding:12px 20px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.15s
}
button:hover{
    transform:translateY(-2px);
    box-shadow:4px 4px 0 #111
}
button:active{
    transform:translateY(1px);
    box-shadow:none
}
button:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
    box-shadow:none
}
.primary{
    background:#111;
    color:#fff
}
.counter{
    text-align:center;
    font-weight:800;
    margin:10px 0 20px
}
.counter span{
    background:#fff;
    border:2px solid #111;
    border-radius:999px;
    padding:7px 16px
}
.deck-area{
    display:flex;
    justify-content:center;
    min-height:520px
}
.card{
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px solid #111;
    border-radius:18px;
    box-shadow:7px 7px 0 #111;
    padding:20px;
    display:flex;
    flex-direction:column;
    animation:appear .25s ease
}
@keyframes appear{
    from{
        opacity:0;
        transform:scale(.96) rotateY(-8deg)
    }
    to{
        opacity:1;
        transform:scale(1) rotateY(0)
    }
}
.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    font-size:18px;
    padding-bottom:12px;
    border-bottom:3px solid #111
}
.card-number{
    font-size:13px;
    color:#666
}
.word{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(42px,9vw,78px);
    font-weight:900;
    letter-spacing:-2px;
    padding:20px;
    text-transform:uppercase
}
.draw-note{
    background:#e8e8e8;
    border-radius:13px;
    padding:16px;
    text-align:center;
    font-size:15px;
    font-weight:700
}
.draw-note small{
    display:block;
    margin-top:6px;
    color:#555;
    font-weight:400
}
.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px dashed #111;
    border-radius:18px;
    padding:30px
}
.loading{
    font-size:24px;
    font-weight:800
}
.error{
    color:#b00020;
    font-weight:700
}
@media(max-width:600px){
    body{
        padding:12px
    }
    .card{
        min-height:440px;
        padding:15px;
        box-shadow:5px 5px 0 #111
    }
    .deck-area{
        min-height:445px
    }
    .word{
        font-size:46px
    }
    .topbar button{
        flex:1 1 120px
    }
}
</style>
</head>
<body>
<main class="game">
<header>
<h1>PICTIONARY</h1>
<p class="subtitle">
Draw the word on the board — your group has to guess!
</p>
</header>
<div class="topbar">
<button
    class="primary"
    id="drawBtn">
    🎴 DRAW CARD
</button>
<button
    id="skipBtn">
    ⏭ SKIP CARD
</button>
<button
    id="resetBtn">
    ↺ RESET
</button>
</div>
<div class="counter">
<span>
Cards played:
<b id="played">0</b>
</span>
</div>
<section
    class="deck-area"
    id="deckArea">
<div class="empty">
<div>
<h2>🎨 Ready to draw?</h2>
<p>
Click <b>DRAW CARD</b>
to generate a random English word.
</p>
<p>
Words are generated automatically.
</p>
<p>
Only the person drawing should look at the screen.
</p>
</div>
</div>
</section>
</main>
<script>
/*
====================================================
PICTIONARY — AUTOMATIC WORD GENERATOR
No word list is stored in this HTML.
The game requests a random English word
from an external word service.
====================================================
*/
const area =
document.getElementById("deckArea");
const drawBtn =
document.getElementById("drawBtn");
const skipBtn =
document.getElementById("skipBtn");
const resetBtn =
document.getElementById("resetBtn");
const playedElement =
document.getElementById("played");
let cardsPlayed = 0;
let lastWord = "";
/*
====================================================
API
====================================================
*/
const API =
"https://random-word-api.vercel.app/api?words=1";
/*
====================================================
UPDATE COUNTER
====================================================
*/
function updateCounter(){
    playedElement.textContent =
        cardsPlayed;
}
/*
====================================================
LOADING SCREEN
====================================================
*/
function loading(){
    area.innerHTML = `
        <div class="empty">
            <div>
                <div class="loading">
                    🎨 Generating word...
                </div>
                <p>
                    The next word is being selected.
                </p>
            </div>
        </div>
    `;
}
/*
====================================================
GET RANDOM WORD
====================================================
*/
async function getRandomWord(){
    try{
        const response =
            await fetch(API);
        if(!response.ok){
            throw new Error(
                "Could not connect to word service."
            );
        }
        const data =
            await response.json();
        if(
            !Array.isArray(data) ||
            !data.length
        ){
            throw new Error(
                "Invalid word."
            );
        }
        const word =
            String(data[0])
            .trim()
            .toUpperCase();
        /*
        Avoid immediate repetition
        */
        if(
            word === lastWord
        ){
            return getRandomWord();
        }
        lastWord =
            word;
        return word;
    }catch(error){
        throw error;
    }
}
/*
====================================================
SHOW CARD
====================================================
*/
function showCard(
    word,
    skipped = false
){
    area.innerHTML = `
        <article class="card">
            <div class="card-top">
                <span>
                    ✏️ DRAW THIS!
                </span>
                <span class="card-number">
                    CARD #${cardsPlayed}
                </span>
            </div>
            <div class="word">
                ${word}
            </div>
            <div class="draw-note">
                ${
                    skipped
                    ? "⏭ CARD SKIPPED"
                    : "🎨 DRAW IT ON THE BOARD!"
                }
                <small>
                    The group must guess the word.
                    Don't show the screen to the group.
                </small>
            </div>
        </article>
    `;
}
/*
====================================================
DRAW
====================================================
*/
async function draw(){
    drawBtn.disabled =
        true;
    skipBtn.disabled =
        true;
    loading();
    try{
        const word =
            await getRandomWord();
        cardsPlayed++;
        showCard(
            word,
            false
        );
        updateCounter();
    }catch(error){
        showError();
    }
    drawBtn.disabled =
        false;
    skipBtn.disabled =
        false;
}
/*
====================================================
SKIP
====================================================
*/
async function skip(){
    drawBtn.disabled =
        true;
    skipBtn.disabled =
        true;
    loading();
    try{
        const word =
            await getRandomWord();
        cardsPlayed++;
        showCard(
            word,
            true
        );
        updateCounter();
    }catch(error){
        showError();
    }
    drawBtn.disabled =
        false;
    skipBtn.disabled =
        false;
}
/*
====================================================
ERROR
====================================================
*/
function showError(){
    area.innerHTML = `
        <div class="empty">
            <div>
                <h2>⚠️ Something went wrong</h2>
                <p class="error">
                    We couldn't generate a word.
                </p>
                <p>
                    Check your internet connection
                    and try again.
                </p>
                <button
                    onclick="draw()">
                    🔄 TRY AGAIN
                </button>
            </div>
        </div>
    `;
}
/*
====================================================
RESET
====================================================
*/
function resetGame(){
    cardsPlayed =
        0;
    lastWord =
        "";
    updateCounter();
    area.innerHTML = `
        <div class="empty">
            <div>
                <h2>🎨 Ready to draw?</h2>
                <p>
                    Click <b>DRAW CARD</b>
                    to generate a random English word.
                </p>
                <p>
                    Words are generated automatically.
                </p>
                <p>
                    Only the person drawing should look
                    at the screen.
                </p>
            </div>
        </div>
    `;
}
/*
====================================================
BUTTONS
====================================================
*/
drawBtn.onclick =
    draw;
skipBtn.onclick =
    skip;
resetBtn.onclick =
    resetGame;
updateCounter();
</script>
</body>
</html>
