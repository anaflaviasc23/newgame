<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>Pictionary - English Game</title>
<style>
*{
    box-sizing:border-box
}
body{
    margin:0;
    min-height:100vh;
    padding:22px;
    font-family:Arial,sans-serif;
    background:#f4f4f2;
    color:#111;
    display:flex;
    justify-content:center
}
.game{
    width:min(1000px,100%)
}
header{
    text-align:center;
    margin-bottom:18px
}
h1{
    margin:0 0 6px;
    font-size:clamp(30px,6vw,52px)
}
.subtitle{
    margin:0;
    color:#555
}
.topbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:18px 0
}
button{
    border:2px solid #111;
    background:#fff;
    color:#111;
    border-radius:10px;
    padding:12px 20px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.15s
}
button:hover{
    transform:translateY(-2px);
    box-shadow:4px 4px 0 #111
}
button:active{
    transform:translateY(1px);
    box-shadow:none
}
button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:none
}
.primary{
    background:#111;
    color:#fff
}
.counter{
    text-align:center;
    font-weight:800;
    margin:10px 0 20px
}
.counter span{
    background:#fff;
    border:2px solid #111;
    border-radius:999px;
    padding:7px 16px
}
.deck-area{
    display:flex;
    justify-content:center;
    min-height:520px
}
.card{
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px solid #111;
    border-radius:18px;
    box-shadow:7px 7px 0 #111;
    padding:20px;
    display:flex;
    flex-direction:column;
    animation:appear .25s ease
}
@keyframes appear{
    from{
        opacity:0;
        transform:scale(.96) rotateY(-8deg)
    }
    to{
        opacity:1;
        transform:scale(1) rotateY(0)
    }
}
.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    font-size:18px;
    padding-bottom:12px;
    border-bottom:3px solid #111
}
.card-number{
    font-size:13px;
    color:#666
}
.word{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(42px,9vw,78px);
    font-weight:900;
    letter-spacing:-2px;
    padding:20px
}
.draw-note{
    background:#e8e8e8;
    border-radius:13px;
    padding:16px;
    text-align:center;
    font-size:15px;
    font-weight:700
}
.draw-note small{
    display:block;
    margin-top:6px;
    color:#555;
    font-weight:400
}
.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px dashed #111;
    border-radius:18px;
    padding:30px
}
@media(max-width:600px){
    body{
        padding:12px
    }
    .card{
        min-height:440px;
        padding:15px;
        box-shadow:5px 5px 0 #111
    }
    .deck-area{
        min-height:445px
    }
    .word{
        font-size:46px
    }
    .topbar button{
        flex:1 1 120px
    }
}
</style>
</head>
<body>
<main class="game">
<header>
<h1>PICTIONARY</h1>
<p class="subtitle">
Draw the word on the board — your group has to guess!
</p>
</header>
<div class="topbar">
<button
    class="primary"
    id="drawBtn">
    🎴 DRAW CARD
</button>
<button
    id="skipBtn">
    ⏭ SKIP CARD
</button>
<button
    id="shuffleBtn">
    🔀 SHUFFLE DECK
</button>
<button
    id="resetBtn">
    ↺ RESET
</button>
</div>
<div class="counter">
<span>
Cards left:
<b id="remaining">100</b>
</span>
</div>
<section
    class="deck-area"
    id="deckArea">
<div class="empty">
<div>
<h2>🎨 Ready to draw?</h2>
<p>
Click <b>DRAW CARD</b>
to reveal the word.
</p>
<p>
Only the person drawing should look at the screen!
</p>
</div>
</div>
</section>
</main>
<script>
/*
====================================================
PICTIONARY
100 UNIQUE WORDS
====================================================
All words are in ONE single deck.
There are no levels or categories.
Once a card is drawn or skipped,
it is permanently removed from the current game.
SHUFFLE only rearranges the remaining cards.
RESET creates a completely new deck.
====================================================
*/
const originalCards = [
   "TELEVISION",

    "REFRIGERATOR",

    "MICROWAVE",

    "KEYBOARD",

    "MOUSE",

    "PRINTER",

    "SPEAKER",

    "TABLET",

    "SUITCASE",

    "BRUSH",

    "HAT",

    "JACKET",

    "DRESS",

    "SHIRT",

    "PANTS",

    "SOCKS",

    "SHOE",

    "RING",

    "NECKLACE",

    "GLOVE",

    "PINEAPPLE",

    "WATERMELON",

    "STRAWBERRY",

    "GRAPE",

    "LEMON",

    "CARROT",

    "TOMATO",

    "ONION",

    "PUMPKIN",

    "POTATO",

    "PIZZA",

    "BURGER",

    "PANCAKE",

    "COOKIE",

    "DONUT",

    "CUPCAKE",

    "POPCORN",

    "NOODLES",

    "CHEESE",

    "SOUP",

    "BASKETBALL",

    "FOOTBALL",

    "TENNIS",

    "BASEBALL",

    "VOLLEYBALL",

    "SKATEBOARD",

    "SURFBOARD",

    "BICYCLE",

    "TROPHY",

    "MEDAL",

    "KITCHEN",

    "BEDROOM",

    "BATHROOM",

    "GARDEN",

    "GARAGE",

    "CLASSROOM",

    "PLAYGROUND",

    "OFFICE",

    "THEATER",

    "STADIUM",

    "FARMER",

    "NURSE",

    "DENTIST",

    "LAWYER",

    "ACTOR",

    "SINGER",

    "DANCER",

    "PHOTOGRAPHER",

    "DRIVER",

    "WAITRESS",

    "PAINT",

    "CUT",

    "BUILD",

    "BREAK",

    "CARRY",

    "PUSH",

    "PULL",

    "CATCH",

    "THROW",

    "CLIMB",

    "LAUGH",

    "CRY",

    "KISS",

    "HUG",

    "WAVE",

    "POINT",

    "THINK",

    "DREAM",

    "SEARCH",

    "WAIT",

    "SUNSET",

    "OCEAN",

    "DESERT",

    "WATERFALL",

    "ISLAND",

    "BRIDGE",

    "ROCKET",

    "TREASURE",

    "ROBOT",

    "DRAGON"
];
/*
====================================================
GAME VARIABLES
====================================================
*/
let deck = [];
let cardsPlayed = 0;
/*
====================================================
HTML ELEMENTS
====================================================
*/
const area =
    document.getElementById("deckArea");
const remaining =
    document.getElementById("remaining");
const drawBtn =
    document.getElementById("drawBtn");
const skipBtn =
    document.getElementById("skipBtn");
const shuffleBtn =
    document.getElementById("shuffleBtn");
const resetBtn =
    document.getElementById("resetBtn");
/*
====================================================
SHUFFLE
====================================================
*/
function shuffle(array){
    const shuffled =
        [...array];
    for(
        let i = shuffled.length - 1;
        i > 0;
        i--
    ){
        const j =
            Math.floor(
                Math.random() * (i + 1)
            );
        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];
    }
    return shuffled;
}
/*
====================================================
UPDATE COUNTER
====================================================
*/
function update(){
    remaining.textContent =
        deck.length;
}
/*
====================================================
READY SCREEN
====================================================
*/
function ready(){
    area.innerHTML = `
        <div class="empty">
            <div>
                <h2>🎨 Ready to draw?</h2>
                <p>
                    Click <b>DRAW CARD</b>
                    to reveal the word.
                </p>
                <p>
                    There are
                    <b>${deck.length}</b>
                    cards remaining.
                </p>
                <p>
                    Only the person drawing
                    should look at the screen!
                </p>
            </div>
        </div>
    `;
}
/*
====================================================
SHOW CARD
====================================================
*/
function show(
    word,
    skipped = false
){
    area.innerHTML = `
        <article class="card">
            <div class="card-top">
                <span>
                    ✏️ DRAW THIS!
                </span>
                <span class="card-number">
                    CARD #${cardsPlayed}
                </span>
            </div>
            <div class="word">
                ${word}
            </div>
            <div class="draw-note">
                ${
                    skipped
                    ? "⏭ CARD SKIPPED"
                    : "🎨 DRAW IT ON THE BOARD!"
                }
                <small>
                    The group must guess the word.
                    Don't show the screen to the group.
                </small>
            </div>
        </article>
    `;
}
/*
====================================================
DRAW CARD
====================================================
*/
function draw(){
    /*
    If there are no cards,
    show completion screen.
    */
    if(deck.length === 0){
        complete();
        return;
    }
    /*
    Select one random card.
    */
    const index =
        Math.floor(
            Math.random() * deck.length
        );
    /*
    IMPORTANT:
    splice removes the card
    permanently from the deck.
    Therefore it CANNOT appear again
    during this game.
    */
    const word =
        deck.splice(index,1)[0];
    cardsPlayed++;
    show(
        word,
        false
    );
    update();
}
/*
====================================================
SKIP CARD
====================================================
*/
function skip(){
    if(deck.length === 0){
        complete();
        return;
    }
    /*
    SKIP also removes the card
    permanently.
    It will NOT return to the deck.
    */
    const index =
        Math.floor(
            Math.random() * deck.length
        );
    const word =
        deck.splice(index,1)[0];
    cardsPlayed++;
    show(
        word,
        true
    );
    update();
}
/*
====================================================
SHUFFLE REMAINING CARDS
====================================================
*/
function shuffleDeck(){
    /*
    Only the cards that are still
    inside the deck are shuffled.
    Used cards are NOT added back.
    */
    deck =
        shuffle(deck);
    update();
    if(deck.length){
        ready();
    }else{
        complete();
    }
}
/*
====================================================
DECK COMPLETE
====================================================
*/
function complete(){
    area.innerHTML = `
        <div class="empty">
            <div>
                <h2>🎉 Deck complete!</h2>
                <p>
                    You played
                    <b>${cardsPlayed}</b>
                    cards.
                </p>
                <p>
                    No card was repeated.
                </p>
                <button
                    onclick="resetGame()">
                    ↺ PLAY AGAIN
                </button>
            </div>
        </div>
    `;
}
/*
====================================================
RESET
====================================================
*/
function resetGame(){
    /*
    Creates a completely fresh copy
    of all 100 cards.
    */
    deck =
        shuffle(originalCards);
    cardsPlayed =
        0;
    update();
    ready();
}
/*
====================================================
BUTTONS
====================================================
*/
drawBtn.onclick =
    draw;
skipBtn.onclick =
    skip;
shuffleBtn.onclick =
    shuffleDeck;
resetBtn.onclick =
    resetGame;
/*
====================================================
START GAME
====================================================
*/
resetGame();
</script>
</body>
</html>
