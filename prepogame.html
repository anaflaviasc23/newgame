<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Prepositions of Place</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f4f2;

    color: #111;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

}


/* =====================================================
   GAME
===================================================== */

.game {

    width: 100%;

    max-width: 950px;

    background: #fff;

    border: 3px solid #111;

    box-shadow: 8px 8px 0 #111;

    padding: 30px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    border-bottom: 3px solid #111;

    padding-bottom: 20px;

    margin-bottom: 20px;

}

.header h1 {

    margin: 0;

    color: #111;

    font-size: 32px;

    font-weight: 900;

    letter-spacing: 1px;

}

.header p {

    margin: 8px 0 0;

    color: #555;

    font-size: 15px;

}


/* =====================================================
   INFO
===================================================== */

.info {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #111;

    color: #fff;

    padding: 11px 18px;

    margin-bottom: 25px;

    font-weight: bold;

    font-size: 16px;

}


/* =====================================================
   IMAGE
===================================================== */

.image-box {

    width: 100%;

    height: 350px;

    background: #fafafa;

    border: 3px dashed #111;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

}

#scene {

    width: 100%;

    height: 100%;

}

#scene svg {

    width: 100%;

    height: 100%;

}


/* =====================================================
   QUESTION
===================================================== */

.question {

    text-align: center;

    margin: 25px 0 20px;

}

.question h2 {

    margin: 0;

    font-size: 25px;

    color: #111;

    font-weight: 900;

}

.blank {

    color: #e91e63;

    font-weight: 900;

}


/* =====================================================
   ANSWERS
===================================================== */

.answers {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;

}

.answer {

    background: #f4f4f2;

    color: #111;

    border: 3px solid #111;

    padding: 16px;

    min-height: 60px;

    font-size: 17px;

    font-weight: 900;

    cursor: pointer;

    transition: .15s;

    box-shadow: 4px 4px 0 #111;

}

.answer:hover {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #111;

    background: #e9e3dc;

}

.answer:active {

    transform:
        translate(4px, 4px);

    box-shadow: none;

}


/* =====================================================
   CORRECT / WRONG
===================================================== */

.answer.correct {

    background: #111;

    border-color: #111;

    color: #fff;

}

.answer.wrong {

    background: #e91e63;

    border-color: #111;

    color: #fff;

}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    text-align: center;

    min-height: 28px;

    margin: 20px 0;

    font-size: 18px;

    font-weight: 900;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next {

    display: block;

    margin: auto;

    padding: 14px 30px;

    border: 3px solid #111;

    background: #111;

    color: #fff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 #ccc;

}

.next:hover {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #ccc;

}

.next:active {

    transform:
        translate(4px, 4px);

    box-shadow: none;

}


/* =====================================================
   FINAL
===================================================== */

.final {

    text-align: center;

    padding: 40px 10px;

}

.final h2 {

    color: #111;

    font-size: 32px;

    font-weight: 900;

}

.final p {

    font-size: 20px;

    font-weight: bold;

}

.restart {

    border: 3px solid #111;

    background: #111;

    color: white;

    padding: 14px 28px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 #ccc;

}

.restart:hover {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #ccc;

}

.hidden {

    display: none !important;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

    body {

        padding: 15px;

        align-items: flex-start;

    }

    .game {

        margin-top: 8px;

        padding: 20px;

        box-shadow: 5px 5px 0 #111;

    }

    .header {

        flex-direction: column;

        align-items: stretch;

        text-align: center;

    }

    .header h1 {

        font-size: 27px;

    }

    .info {

        justify-content: center;

        gap: 20px;

        flex-wrap: wrap;

    }

    .image-box {

        height: 280px;

    }

    .question h2 {

        font-size: 21px;

    }

    .answers {

        grid-template-columns: 1fr;

    }

    .answer {

        padding: 15px;

    }

}

@media(max-width: 450px) {

    .game {

        padding: 15px;

    }

    .image-box {

        height: 245px;

    }

}

</style>

</head>

/* =====================================================

===================================================== */

function svg(content) {

    return `

    <svg
        viewBox="0 0 700 350"
        xmlns="http://www.w3.org/2000/svg">

        <rect
            width="700"
            height="350"
            fill="#fffdfb"/>

            height="65"
            fill="#eadfd5"/>

        ${content}

}


/* =====================================================
   BOX
===================================================== */

function box(x, y, scale = 1) {

        translate(${x},${y})

            fill="#e8a64d"/>

            fill="#f3bc69"/>

        <path
            d="

            L130 -5
            L140 25
            L70 50
            Z"
            fill="#f0b45f"/>

    </g>

    `;

}


/* =====================================================

/* =====================================================
   EMBARALHAR
===================================================== */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =====================================================
   CARREGAR QUESTÃO
===================================================== */

function loadQuestion() {

    answered = false;

    const q =
        questions[current];


    questionNumber.textContent =
        `Question ${current + 1}/${questions.length}`;


    scene.innerHTML =
        createScene(q.type);


    questionText.innerHTML =
        q.sentence.replace(
            "______",
            `<span class="blank">______</span>`
        );


    feedback.textContent = "";

    nextButton.classList.add("hidden");


    const wrong =
        shuffle(
            options.filter(
                option =>
                option !== q.correct
            )
        ).slice(0,3);


    const answerOptions =
        shuffle([
            q.correct,
            ...wrong
        ]);


    answers.innerHTML = "";


    answerOptions.forEach(
        option => {

            const button =
                document.createElement("button");

            button.className =
                "answer";

            button.textContent =
                option;


            button.addEventListener(
                "click",
                () => {

                    checkAnswer(
                        button,
                        option,
                        q.correct
                    );

                }
            );


            answers.appendChild(button);

        }
    );

}


/* =====================================================
   VERIFICAR
===================================================== */

function checkAnswer(
    button,
    selected,
    correct
) {

    if (answered)
        return;


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(btn => {

        btn.disabled = true;


        if (
            btn.textContent === correct
        ) {

            btn.classList.add(
                "correct"
            );

        }

    });


    if (
        selected === correct
    ) {

        button.classList.add(
            "correct"
        );


        score += 10;


        scoreElement.textContent =
            score;


        feedback.textContent =
            "✅ Correct! Great job!";

    }

    else {

        button.classList.add(
            "wrong"
        );


        feedback.textContent =
            `❌ The correct answer is: ${correct}`;

    }


    nextButton.classList.remove(
        "hidden"
    );

}


/* =====================================================
   PRÓXIMA QUESTÃO
===================================================== */

nextButton.addEventListener(
    "click",
    () => {

        current++;

        if (
            current >=
            questions.length
        ) {

            showFinal();

        }

        else {

            loadQuestion();

        }

    }
);


/* =====================================================
   FINAL
===================================================== */

function showFinal() {

    document
        .getElementById("gameArea")
        .classList.add("hidden");


    document
        .getElementById("finalScreen")
        .classList.remove("hidden");


    document
        .getElementById("finalScore")
        .textContent =
        `You scored ${score} out of ${questions.length * 10} points!`;

}
