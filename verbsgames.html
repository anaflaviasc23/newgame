<style>

*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    padding:22px;
    font-family:Arial,sans-serif;
    background:#f4f4f2;
    color:#111;
    display:flex;
    justify-content:center
}

.game{
    width:min(1000px,100%)
}

header{
    text-align:center;
    margin-bottom:18px
}

h1{
    margin:0 0 6px;
    font-size:clamp(30px,6vw,52px)
}

.subtitle{
    margin:0;
    color:#555
}

.topbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin:18px 0
}

button{
    border:2px solid #111;
    background:#fff;
    color:#111;
    border-radius:10px;
    padding:12px 20px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.15s
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 0 #111
}

button:active{
    transform:translateY(1px);
    box-shadow:none
}

.primary{
    background:#111;
    color:#fff
}

.counter{
    text-align:center;
    font-weight:800;
    margin:10px 0 20px
}

.counter span{
    background:#fff;
    border:2px solid #111;
    border-radius:999px;
    padding:7px 16px
}

.deck-area{
    display:flex;
    justify-content:center;
    min-height:520px
}

.card{
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px solid #111;
    border-radius:18px;
    box-shadow:7px 7px 0 #111;
    padding:20px;
    display:flex;
    flex-direction:column;
    animation:appear .25s ease
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.96) rotateY(-8deg)
    }

    to{
        opacity:1;
        transform:scale(1) rotateY(0)
    }
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    font-size:18px;
    padding-bottom:12px;
    border-bottom:3px solid #111
}

.card-number{
    font-size:13px;
    color:#666
}

.word{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(42px,9vw,78px);
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase
}

.draw-note{
    background:#e8e8e8;
    border-radius:13px;
    padding:16px;
    text-align:center;
    font-size:15px;
    font-weight:700
}

.draw-note small{
    display:block;
    margin-top:6px;
    color:#555;
    font-weight:400
}

.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    width:min(650px,94vw);
    min-height:490px;
    background:#fff;
    border:3px dashed #111;
    border-radius:18px;
    padding:30px
}

.answer{
    margin-top:12px;
    font-size:clamp(25px,6vw,45px);
    font-weight:900;
    text-align:center;
    text-transform:uppercase
}

.answer-label{
    font-size:12px;
    color:#666;
    letter-spacing:1px;
    font-weight:800
}

@media(max-width:600px){

    body{
        padding:12px
    }

    .card{
        min-height:440px;
        padding:15px;
        box-shadow:5px 5px 0 #111
    }

    .deck-area{
        min-height:445px
    }

    .word{
        font-size:46px
    }

    .topbar button{
        flex:1 1 120px
    }

}

</style>

</head>

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(a){

    let x=[...a];

    for(
        let i=x.length-1;
        i>0;
        i--
    ){

        let j=
        Math.floor(
            Math.random()*(i+1)
        );

        [
            x[i],
            x[j]
        ]=[
            x[j],
            x[i]
        ];

    }

    return x;
}


/* =====================================================
   UPDATE
===================================================== */

    remaining.textContent=

}

}

    `;

}

    if(!deck.length){

        area.innerHTML=`

            <div class="empty">

                <div>

                    <h2>🎉 Deck complete!</h2>

                    <p>
                        You used all the verbs.
                    </p>

                    <p>
                        Click <b>RESET</b>
                        to play again.
                    </p>

                </div>

            </div>

        `;

        answerBtn.disabled=true;

        return;

    }


    let i=
        Math.floor(
            Math.random()*deck.length
        );


    let card=
        deck.splice(i,1)[0];


    show(card);

    update();

}


/* =====================================================
   SKIP
===================================================== */

function skip(){

    if(!deck.length){

        return;

    }


    let i=
        Math.floor(
            Math.random()*deck.length
        );


    let card=
        deck.splice(i,1)[0];


    show(card,true);

    update();

}


/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer(){

    if(!currentCard){

        return;

    }


    const answer=
        document.getElementById("answer");


    if(answer){

        answer.textContent=
            currentCard.past;

    }

}


/* =====================================================
   SHUFFLE DECK
===================================================== */

document.getElementById(
    "shuffleBtn"
).onclick=()=>{

    deck=
        shuffle(
            deck.length
            ? deck
            : originalCards
        );

    ready();

    update();

    answerBtn.disabled=true;

    currentCard=null;

};


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
    "drawBtn"
).onclick=draw;


document.getElementById(
    "skipBtn"
).onclick=skip;


answerBtn.onclick=
    showAnswer;


/* =====================================================
   RESET
===================================================== */

document.getElementById(
    "resetBtn"
).onclick=()=>{

    deck=
        shuffle(originalCards);

    currentCard=null;

    answerBtn.disabled=true;

    ready();

    update();

};


/* =====================================================
   START
===================================================== */

deck=
    shuffle(originalCards);

update();

</script>

</body>
</html>
