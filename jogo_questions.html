<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Negative & Interrogative Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f2;
    color: #111;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game {
    width: 100%;
    max-width: 950px;
}

.card {
    background: white;
    border: 3px solid #111;
    border-radius: 18px;
    box-shadow: 8px 8px 0 #111;
    padding: 35px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.title {
    text-align: left;
}

.title h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 900;
}

.title p {
    margin: 6px 0 0;
    font-size: 14px;
    color: #555;
}

.stats {
    display: flex;
    gap: 10px;
}

.stat {
    border: 2px solid #111;
    border-radius: 10px;
    padding: 9px 15px;
    text-align: center;
    min-width: 90px;
}

.stat span {
    display: block;
    font-size: 11px;
    font-weight: bold;
}

.stat strong {
    font-size: 22px;
}


/* TABS */

.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;

    margin-bottom: 25px;

    border-bottom: 3px solid #111;
    padding-bottom: 12px;
}

.tab {
    border: 2px solid #111;
    background: white;
    color: #111;

    padding: 12px 22px;

    border-radius: 9px;

    font-size: 14px;
    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

.tab:hover {
    transform: translateY(-2px);
}

.tab.active {
    background: #111;
    color: white;
}


/* MODE */

.mode {
    display: inline-block;

    background: #111;
    color: white;

    padding: 9px 17px;

    border-radius: 8px;

    font-weight: bold;
    font-size: 14px;

    margin-bottom: 14px;
}


/* INSTRUCTION */

.instruction {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 18px;
}


/* WORDS */

.words-area {
    border: 3px dashed #111;
    border-radius: 14px;

    padding: 22px;

    min-height: 120px;

    margin-bottom: 20px;
}

.words-title {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;

    margin-bottom: 15px;

    color: #555;
}

.words {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;
}


/* WORD BUTTON */

.word {
    border: 2px solid #111;

    background: white;
    color: #111;

    padding: 13px 18px;

    border-radius: 10px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

.word:hover {
    transform: translateY(-2px);
    box-shadow: 3px 3px 0 #111;
}

.word.selected {
    background: #111;
    color: white;

    transform: translateY(2px);

    box-shadow: none;
}


/* SENTENCE */

.sentence-area {
    border: 3px solid #111;

    border-radius: 14px;

    padding: 22px;

    min-height: 125px;

    margin-bottom: 20px;

    background: #fafafa;
}

.sentence-title {
    font-size: 12px;
    font-weight: bold;

    letter-spacing: 1px;

    color: #555;

    margin-bottom: 15px;
}

.sentence {
    min-height: 55px;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 8px;
}

.placeholder {
    color: #999;

    font-size: 15px;
}


/* SELECTED WORD */

.selected-word {
    background: #111;

    color: white;

    border: 2px solid #111;

    border-radius: 8px;

    padding: 10px 14px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.selected-word:hover {
    opacity: .7;
}


/* BUTTONS */

.buttons {
    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;
}

.action {
    border: 3px solid #111;

    background: white;
    color: #111;

    padding: 13px 25px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;

    box-shadow: 4px 4px 0 #111;

    transition: .15s;
}

.action:hover {
    transform: translate(2px, 2px);

    box-shadow: 2px 2px 0 #111;
}

.check {
    background: #111;
    color: white;
}


/* POPUP */

.popup {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    display: flex;

    justify-content: center;

    align-items: center;

    visibility: hidden;

    opacity: 0;

    transition: .2s;

    padding: 20px;

    z-index: 999;
}

.popup.show {
    visibility: visible;
    opacity: 1;
}

.popup-content {
    background: white;

    border: 3px solid #111;

    border-radius: 16px;

    box-shadow: 8px 8px 0 #111;

    padding: 35px 50px;

    text-align: center;

    max-width: 450px;
}

.popup-content h2 {
    margin: 0 0 10px;

    font-size: 30px;
}

.popup-content p {
    margin: 0;

    font-size: 17px;
}


/* MOBILE */

@media (max-width: 600px) {

    .card {
        padding: 22px;
    }

    .title {
        text-align: center;
        width: 100%;
    }

    .title h1 {
        font-size: 23px;
    }

    .header {
        justify-content: center;
    }

    .tabs {
        flex-wrap: wrap;
    }

    .tab {
        padding: 10px 14px;
        font-size: 12px;
    }

    .word {
        font-size: 15px;
        padding: 11px 14px;
    }

    .popup-content {
        padding: 30px 25px;
    }
}

</style>
</head>


<body>

<div class="game">

<div class="card">

    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <h1>NEGATIVE & INTERROGATIVE</h1>

            <p>
                Click the words in the correct order.
            </p>

        </div>


        <div class="stats">

            <div class="stat">

                <span>SCORE</span>

                <strong id="score">0</strong>

            </div>


            <div class="stat">

                <span>QUESTION</span>

                <strong id="question">1</strong>

            </div>

        </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="negativeTab"
        >
            NEGATIVE
        </button>


        <button
            type="button"
            class="tab"
            id="interrogativeTab"
        >
            INTERROGATIVE
        </button>


        <button
            type="button"
            class="tab"
            id="mixedTab"
        >
            MIXED
        </button>

    </div>


    <!-- MODE -->

    <div
        class="mode"
        id="mode"
    >
        NEGATIVE
    </div>


    <div
        class="instruction"
        id="instruction"
    >
        Build the NEGATIVE sentence.
    </div>


    <!-- WORDS -->

    <div class="words-area">

        <div class="words-title">
            WORDS
        </div>

        <div
            class="words"
            id="words"
        ></div>

    </div>


    <!-- SENTENCE -->

    <div class="sentence-area">

        <div class="sentence-title">
            YOUR SENTENCE
        </div>

        <div
            class="sentence"
            id="sentence"
        ></div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            type="button"
            class="action"
            id="clearButton"
        >
            CLEAR
        </button>


        <button
            type="button"
            class="action check"
            id="checkButton"
        >
            CHECK ANSWER
        </button>

    </div>

</div>

</div>


<!-- POPUP -->

<div
    class="popup"
    id="popup"
>

    <div class="popup-content">

        <h2 id="popupTitle"></h2>

        <p id="popupText"></p>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const negativeQuestions = [

    "She is not a doctor",
    "They are not at school",
    "I am not tired",
    "He is not from Canada",
    "We are not ready",
    "It is not expensive",
    "You are not late",
    "She is not my sister",
    "He is not a student",
    "They are not Brazilian",
    "I am not from Brazil",
    "We are not at the airport",
    "It is not a difficult question",
    "She is not an English teacher",
    "You are not wrong",
    "He is not at home",
    "They are not brothers",
    "I am not hungry",
    "The hotel is not near the airport",
    "Those books are not mine",
    "This is not my passport",
    "She is not from France",
    "We are not in Japan",
    "He is not a teacher",
    "They are not Canadian",
    "It is not a big city",
    "I am not your friend",
    "You are not in the classroom",
    "The airport is not far",
    "These are not my shoes"
];


const interrogativeQuestions = [

    "Is she your teacher",
    "Are they from Mexico",
    "Am I late",
    "Is he your brother",
    "Are we at the airport",
    "Is it a Canadian city",
    "Are you ready",
    "Is she from France",
    "Are they students",
    "Am I correct",
    "Is he an English teacher",
    "Are we late for class",
    "Is the hotel expensive",
    "Are those your books",
    "Is this your passport",
    "Are you from Brazil",
    "Is she your mother",
    "Are they at the hotel",
    "Is it difficult",
    "Are we ready to go",
    "Is he from Argentina",
    "Are you Brazilian",
    "Is this a French city",
    "Are they your friends",
    "Is she a student",
    "Are we in Canada",
    "Is the airport near",
    "Are these your books",
    "Is he at home",
    "Are they from Japan"
];


/* =====================================================
   VARIABLES
===================================================== */

let currentMode = "negative";

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedWords = [];

let locked = false;


/* =====================================================
   ELEMENTS
===================================================== */

const wordsBox =
    document.getElementById("words");

const sentenceBox =
    document.getElementById("sentence");

const modeBox =
    document.getElementById("mode");

const instructionBox =
    document.getElementById("instruction");

const scoreBox =
    document.getElementById("score");

const questionBox =
    document.getElementById("question");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const negativeTab =
    document.getElementById("negativeTab");

const interrogativeTab =
    document.getElementById("interrogativeTab");

const mixedTab =
    document.getElementById("mixedTab");

const clearButton =
    document.getElementById("clearButton");

const checkButton =
    document.getElementById("checkButton");


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;
}


/* =====================================================
   CHANGE MODE
===================================================== */

negativeTab.addEventListener(
    "click",
    () => {

        startMode("negative");

    }
);


interrogativeTab.addEventListener(
    "click",
    () => {

        startMode("interrogative");

    }
);


mixedTab.addEventListener(
    "click",
    () => {

        startMode("mixed");

    }
);


/* =====================================================
   START MODE
===================================================== */

function startMode(mode) {

    currentMode = mode;

    currentIndex = 0;

    score = 0;

    scoreBox.innerText = "0";

    locked = false;


    /* ACTIVE TAB */

    negativeTab.classList.remove("active");

    interrogativeTab.classList.remove("active");

    mixedTab.classList.remove("active");


    if (mode === "negative") {

        negativeTab.classList.add("active");

        questions =
            shuffle(
                negativeQuestions
            );

    }

    else if (mode === "interrogative") {

        interrogativeTab.classList.add("active");

        questions =
            shuffle(
                interrogativeQuestions
            );

    }

    else {

        mixedTab.classList.add("active");

        questions =
            shuffle([

                ...negativeQuestions,

                ...interrogativeQuestions

            ]);

    }


    loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    locked = false;

    selectedWords = [];

    wordsBox.innerHTML = "";

    sentenceBox.innerHTML = "";


    const answer =
        questions[currentIndex];


    /* DETERMINE TYPE */

    let type;


    if (currentMode === "mixed") {

        const first =
            answer.split(" ")[0];


        if (
            first === "Is" ||
            first === "Are" ||
            first === "Am"
        ) {

            type = "interrogative";

        }

        else {

            type = "negative";

        }

    }

    else {

        type = currentMode;

    }


    /* DISPLAY TYPE */

    if (type === "negative") {

        modeBox.innerText =
            "NEGATIVE";

        instructionBox.innerText =
            "Build the NEGATIVE sentence.";

    }

    else {

        modeBox.innerText =
            "INTERROGATIVE";

        instructionBox.innerText =
            "Build the INTERROGATIVE sentence.";

    }


    questionBox.innerText =
        currentIndex + 1;


    /* ORIGINAL WORDS */

    const originalWords =
        answer.split(" ");


    /* SHUFFLED WORDS */

    let shuffledWords;


    do {

        shuffledWords =
            shuffle(originalWords);

    }

    while (
        shuffledWords.join(" ") ===
        originalWords.join(" ")
    );


    /* CREATE BUTTONS */

    shuffledWords.forEach(
        (word, index) => {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className = "word";

            button.innerText = word;

            button.dataset.word = word;


            button.addEventListener(
                "click",
                function () {

                    chooseWord(
                        button,
                        word
                    );

                }
            );


            wordsBox.appendChild(button);

        }
    );


    showPlaceholder();

}


/* =====================================================
   CHOOSE WORD
===================================================== */

function chooseWord(
    button,
    word
) {

    if (locked) {
        return;
    }


    if (
        button.classList.contains("selected")
    ) {

        return;

    }


    button.classList.add("selected");


    selectedWords.push({

        text: word,

        element: button

    });


    renderSentence();

}


/* =====================================================
   RENDER SENTENCE
===================================================== */

function renderSentence() {

    sentenceBox.innerHTML = "";


    if (
        selectedWords.length === 0
    ) {

        showPlaceholder();

        return;

    }


    selectedWords.forEach(
        (item, index) => {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "selected-word";

            button.innerText =
                item.text;


            button.addEventListener(
                "click",
                function () {

                    removeWord(index);

                }
            );


            sentenceBox.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   PLACEHOLDER
===================================================== */

function showPlaceholder() {

    sentenceBox.innerHTML = `

        <div class="placeholder">

            Click the words above
            to build the sentence.

        </div>

    `;

}


/* =====================================================
   REMOVE WORD
===================================================== */

function removeWord(index) {

    if (locked) {
        return;
    }


    const item =
        selectedWords[index];


    item.element.classList.remove(
        "selected"
    );


    selectedWords.splice(
        index,
        1
    );


    renderSentence();

}


/* =====================================================
   CLEAR
===================================================== */

clearButton.addEventListener(
    "click",
    function () {

        if (locked) {
            return;
        }


        selectedWords.forEach(
            item => {

                item.element.classList.remove(
                    "selected"
                );

            }
        );


        selectedWords = [];

        renderSentence();

    }
);


/* =====================================================
   CHECK ANSWER
===================================================== */

checkButton.addEventListener(
    "click",
    checkAnswer
);


function checkAnswer() {

    if (locked) {
        return;
    }


    /* NÃO DEIXA VERIFICAR VAZIO */

    if (
        selectedWords.length === 0
    ) {

        showPopup(
            "⚠️",
            "Select the words first!"
        );

        setTimeout(
            closePopup,
            800
        );

        return;

    }


    /*
       PEGA A FRASE QUE O ALUNO MONTOU
    */

    const userWords =
        selectedWords.map(
            item => item.text
        );


    /*
       PEGA A RESPOSTA CORRETA
    */

    const correctWords =
        questions[currentIndex]
            .split(" ");


    /*
       COMPARA:
       quantidade + cada posição
    */

    let correct = true;


    if (
        userWords.length !==
        correctWords.length
    ) {

        correct = false;

    }

    else {

        for (
            let i = 0;
            i < correctWords.length;
            i++
        ) {

            if (
                userWords[i].toLowerCase() !==
                correctWords[i].toLowerCase()
            ) {

                correct = false;

                break;

            }

        }

    }


    /* =========================
       CORRECT
    ========================= */

    if (correct) {

        locked = true;

        score++;

        scoreBox.innerText =
            score;


        showPopup(
            "🎉 CORRECT!",
            "Great job!"
        );


        setTimeout(
            function () {

                closePopup();

                nextQuestion();

            },
            1000
        );

    }


    /* =========================
       WRONG
    ========================= */

    else {

        showPopup(
            "❌ TRY AGAIN!",
            "The word order is not correct."
        );


        setTimeout(
            function () {

                closePopup();

            },
            1000
        );

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentIndex++;


    if (
        currentIndex >=
        questions.length
    ) {

        finishGame();

        return;

    }


    loadQuestion();

}


/* =====================================================
   POPUP
===================================================== */

function showPopup(
    title,
    text
) {

    popupTitle.innerText =
        title;

    popupText.innerText =
        text;

    popup.classList.add(
        "show"
    );

}


function closePopup() {

    popup.classList.remove(
        "show"
    );

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame() {

    locked = true;

    wordsBox.innerHTML = "";

    sentenceBox.innerHTML = `

        <div style="
            font-size:24px;
            font-weight:900;
            padding:20px;
        ">

            🎯 GAME COMPLETE!

        </div>

    `;


    modeBox.innerText =
        "FINISHED";


    instructionBox.innerText =
        "Final score: " +
        score +
        " / " +
        questions.length;


    checkButton.style.display =
        "none";


    clearButton.innerText =
        "PLAY AGAIN";


    clearButton.onclick =
        function () {

            checkButton.style.display =
                "inline-block";

            clearButton.innerText =
                "CLEAR";

            startMode(
                currentMode
            );

        };

}


/* =====================================================
   START
===================================================== */

startMode("negative");

</script>

</body>
</html>
