<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f4f2;
  color: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 25px;
}

/* CONTAINER PRINCIPAL */
.game {
  position: relative;
  background: white;
  padding: 30px;
  width: 100%;
  max-width: 950px;
  border: 3px solid #111;
  box-shadow: 8px 8px 0 #111;
  text-align: center;
}

/* TOPO */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid #111;
  padding-bottom: 18px;
}

.title {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
}

#hud {
  background: #111;
  color: white;
  padding: 10px 18px;
  font-size: 18px;
  font-weight: bold;
}

/* NÍVEIS */
.levels {
  margin: 25px 0 15px;
  display: flex;
  justify-content: center;
  gap: 12px;
}

.level-btn {
  padding: 11px 22px;
  cursor: pointer;
  border: 3px solid #111;
  background: #f4f4f2;
  color: #111;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 3px 3px 0 #111;
  transition: 0.15s;
}

.level-btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #111;
}

.level-btn.active {
  background: #111;
  color: white;
}

/* INSTRUÇÃO */
.instruction {
  display: inline-block;
  background: #111;
  color: white;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  margin: 10px 0 25px;
}

/* PALAVRA / NÚMERO */
.word-area {
  border: 3px dashed #111;
  background: #fafafa;
  padding: 30px 20px;
  margin-bottom: 30px;
}

.word {
  font-size: 48px;
  font-weight: 900;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
}

.btn {
  min-height: 65px;
  padding: 15px 10px;
  border: 3px solid #111;
  background: #f4f4f2;
  color: #111;
  font-weight: 900;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 4px 4px 0 #111;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.15s;
}

.btn:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 #111;
  background: #e9e3dc;
}

.btn:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

/* CORES ORIGINAIS DOS BOTÕES - ADAPTADAS AO NOVO ESTILO */
.c1 { background: #f7eee8; }
.c2 { background: #f2e8dc; }
.c3 { background: #e8eef2; }
.c4 { background: #eee8f2; }
.c5 { background: #f5eee0; }
.c6 { background: #e6f0ed; }
.c7 { background: #e8eaed; }
.c8 { background: #e7efe8; }
.c9 { background: #e5efec; }
.c10 { background: #e7edf2; }

/* CORRETO / ERRADO */
.correct {
  background: #111 !important;
  color: white !important;
}

.wrong {
  background: #111 !important;
  color: white !important;
}

/* GAME OVER */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(17,17,17,0.95);
  color: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.overlay h1 {
  font-size: 40px;
  margin: 0 0 10px;
}

.overlay p {
  font-size: 20px;
}

.overlay button {
  margin-top: 20px;
  padding: 14px 28px;
  border: 3px solid white;
  background: white;
  color: #111;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.overlay button:hover {
  background: #111;
  color: white;
}

/* RESPONSIVO */
@media (max-width: 700px) {

  body {
    padding: 15px;
  }

  .game {
    padding: 20px;
    box-shadow: 5px 5px 0 #111;
  }

  .top-bar {
    flex-direction: column;
    gap: 15px;
  }

  .title {
    font-size: 27px;
  }

  #hud {
    width: 100%;
  }

  .levels {
    flex-direction: column;
  }

  .level-btn {
    width: 100%;
  }

  .word {
    font-size: 38px;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .btn {
    min-height: 60px;
    font-size: 16px;
  }

  .overlay h1 {
    font-size: 32px;
  }
}

@media (max-width: 400px) {

  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .word {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="top-bar">
    <div class="title">NUMBER GAME</div>

    <div id="hud">
      ❤️❤️❤️ ✔ 0
    </div>
  </div>

  <div class="levels">
    <button
      class="level-btn active"
      onclick="setLevel(1)"
      id="lvl1">
      Nível 1
    </button>

    <button
      class="level-btn"
      onclick="setLevel(2)"
      id="lvl2">
      Nível 2
    </button>
  </div>

  <div class="instruction">
    CHOOSE THE CORRECT NUMBER
  </div>

  <div class="word-area">
    <div class="word" id="word"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="overlay" id="gameOver">
    <h1>You lose 😢</h1>
    <p>Try again?</p>
    <button onclick="restartGame()">Restart</button>
  </div>

</div>

<!-- SONS -->
<audio
  id="correctSound"
  src="https://www.soundjay.com/buttons/sounds/button-4.mp3">
</audio>

<audio
  id="wrongSound"
  src="https://www.soundjay.com/buttons/sounds/button-10.mp3">
</audio>

<audio
  id="gameOverSound"
  src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3">
</audio>


<script>

const grid = document.getElementById("grid");
const wordEl = document.getElementById("word");
const hud = document.getElementById("hud");

const correctSound =
  document.getElementById("correctSound");

const wrongSound =
  document.getElementById("wrongSound");

const gameOverSound =
  document.getElementById("gameOverSound");

let correctNumber;
let score = 0;
let lives = 3;
let level = 1;


// números
const numbersText = {
  1:"One",
  2:"Two",
  3:"Three",
  4:"Four",
  5:"Five",
  6:"Six",
  7:"Seven",
  8:"Eight",
  9:"Nine",
  10:"Ten",
  11:"Eleven",
  12:"Twelve",
  13:"Thirteen",
  14:"Fourteen",
  15:"Fifteen",
  16:"Sixteen",
  17:"Seventeen",
  18:"Eighteen",
  19:"Nineteen",
  20:"Twenty",
  21:"Twenty-one",
  22:"Twenty-two",
  23:"Twenty-three",
  24:"Twenty-four",
  25:"Twenty-five",
  26:"Twenty-six",
  27:"Twenty-seven",
  28:"Twenty-eight",
  29:"Twenty-nine",
  30:"Thirty"
};


// HUD
function updateHUD(){

  hud.innerHTML =
    "❤️".repeat(lives) +
    ` ✔ ${score}`;

}


// trocar nível
function setLevel(lvl){

  level = lvl;

  document
    .getElementById("lvl1")
    .classList.remove("active");

  document
    .getElementById("lvl2")
    .classList.remove("active");

  document
    .getElementById("lvl" + lvl)
    .classList.add("active");

  newRound();

}


// nova rodada
function newRound(){

  correctNumber =
    Math.floor(Math.random() * 30) + 1;

  wordEl.textContent =
    level === 1
      ? correctNumber
      : numbersText[correctNumber];


  let options =
    new Set([correctNumber]);


  while(options.size < 10){

    options.add(
      Math.floor(Math.random() * 30) + 1
    );

  }


  let shuffled =
    Array.from(options)
      .sort(() => Math.random() - 0.5);


  grid.innerHTML = "";


  shuffled.forEach((num, i) => {

    const btn =
      document.createElement("div");

    btn.className =
      "btn c" + ((i % 10) + 1);

    btn.textContent =
      level === 1
        ? numbersText[num]
        : num;

    btn.onclick =
      () => handleClick(btn, num);

    grid.appendChild(btn);

  });

}


// clique
function handleClick(btn, num){

  if(num === correctNumber){

    btn.classList.add("correct");

    correctSound.play();

    setTimeout(() => {

      score++;

      updateHUD();

      newRound();

    }, 400);

  }

  else {

    btn.classList.add("wrong");

    wrongSound.play();

    setTimeout(() => {

      loseLife();

    }, 400);

  }

}


// vida
function loseLife(){

  lives--;

  updateHUD();

  if(lives <= 0){

    gameOverSound.play();

    document
      .getElementById("gameOver")
      .style.display = "flex";

  }

  else {

    newRound();

  }

}


// restart
function restartGame(){

  score = 0;

  lives = 3;

  updateHUD();

  document
    .getElementById("gameOver")
    .style.display = "none";

  newRound();

}


// start
updateHUD();

newRound();

</script>

</body>
</html>
