<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flag Game - English</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f2;
    color:#111;
    min-height:100vh;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:min(850px, 100%);
}

header{
    text-align:center;
    margin-bottom:18px;
}

h1{
    margin:0 0 6px;
    font-size:clamp(32px, 6vw, 52px);
    font-weight:900;
    letter-spacing:-2px;
}

.subtitle{
    color:#666;
    font-size:15px;
}

.topbar{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:18px 0;
}

.topbar button{
    border:2px solid #111;
    background:white;
    color:#111;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.15s ease;
}

.topbar button:hover{
    transform:translateY(-2px);
    box-shadow:4px 4px 0 #111;
}

.topbar button:active{
    transform:translateY(1px);
    box-shadow:none;
}

.topbar .primary{
    background:#111;
    color:white;
}

.card{
    width:min(800px, 94vw);
    margin:auto;
    padding:20px;
    background:white;
    border:3px solid #111;
    border-radius:18px;
    box-shadow:7px 7px 0 #111;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
    border-bottom:3px solid #111;
    font-size:17px;
    font-weight:900;
}

.card-number{
    font-size:12px;
    color:#777;
}

.flag-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 10px 15px;
}

.flag{
    width:min(360px, 75vw);
    aspect-ratio:3 / 2;
    border-radius:14px;
    overflow:hidden;
    background:#eee;
    border:3px solid #111;
    box-shadow:6px 6px 0 #111;
}

.flag img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.question{
    text-align:center;
    margin:15px 0 20px;
}

.question h2{
    font-size:clamp(20px, 4vw, 28px);
    font-weight:900;
}

.question p{
    color:#666;
    margin-top:5px;
    font-size:14px;
}

.selection-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:10px;
}

.option-group{
    border:2px solid #111;
    border-radius:14px;
    padding:15px;
    background:#fafafa;
}

.option-title{
    text-align:center;
    font-size:18px;
    font-weight:900;
    margin-bottom:12px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.option{
    width:100%;
    padding:12px 10px;
    border:2px solid #222;
    border-radius:9px;
    background:white;
    color:#111;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.15s ease;
}

.option:hover{
    transform:translateY(-2px);
    box-shadow:3px 3px 0 #111;
}

.option.selected{
    background:#111;
    color:white;
    transform:translateY(-2px);
    box-shadow:4px 4px 0 #111;
}

.option.wrong{
    background:#e74c3c;
    color:white;
    border-color:#111;
}

.option.correct{
    background:#27ae60;
    color:white;
    border-color:#111;
}

.check-area{
    text-align:center;
    margin-top:22px;
}

.check-button{
    border:3px solid #111;
    background:#111;
    color:white;
    border-radius:11px;
    padding:13px 35px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.15s ease;
}

.check-button:hover{
    transform:translateY(-2px);
    box-shadow:5px 5px 0 #111;
}

.check-button:active{
    transform:translateY(1px);
    box-shadow:none;
}

.score-area{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.score{
    display:inline-block;
    padding:9px 18px;
    border:2px solid #111;
    border-radius:10px;
    background:#f4f4f2;
    font-weight:900;
}

.progress{
    text-align:center;
    margin-top:10px;
    color:#777;
    font-size:13px;
    font-weight:bold;
}

.popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    color:#111;
    border:3px solid #111;
    border-radius:15px;
    padding:25px 40px;
    font-size:22px;
    font-weight:900;
    box-shadow:7px 7px 0 #111;
    z-index:1000;
    transition:.25s ease;
    text-align:center;
}

.popup.show{
    transform:translate(-50%,-50%) scale(1);
}

@media(max-width:650px){

    body{
        padding:12px;
        align-items:flex-start;
    }

    .card{

    }

    }

    .flag{

    }

    .option{
        padding:11px;
    }

    .check-button{
        width:100%;
    }

}

</style>

/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

    return array;
}


/* ==========================================
   GET WRONG OPTIONS
========================================== */

function getRandomOptions(current, property){

    const options = [current[property]];

    const available = data.filter(
        item =>
            item[property] !== current[property]
    );

    shuffle(available);

    for(
        let i = 0;
        i < available.length &&
        options.length < 4;
        i++
    ){

        if(
            !options.includes(
                available[i][property]
            )
        ){

            options.push(
                available[i][property]
            );

        }

    }

    return shuffle(options);
}


/* ==========================================
   CREATE COUNTRY OPTIONS
========================================== */

function createCountryOptions(){

    const current =
        gameData[index];

    const countries =
        getRandomOptions(
            current,
            "country"
        );

    countries.forEach(
        country => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className = "option";

            button.textContent = country;

            button.dataset.value = country;

            button.addEventListener(
                "click",
                function(){

                    selectCountry(this);

                }
            );

            countryOptions.appendChild(button);

        }
    );
}

                }
            );

            nationalityOptions.appendChild(button);

        }
    );
}

========================================== */

function selectCountry(button){

    if(checking){
        return;
    }

    document
        .querySelectorAll(
            "#countryOptions .option"
        )
        .forEach(
            option => {

                option.classList.remove(
                    "selected"
                );

                option.classList.remove(
                    "wrong"
                );

            }
        );

    button.classList.add("selected");

    selectedCountry =
        button.dataset.value;
}

                    "selected"
                );

                option.classList.remove(
                    "wrong"
                );

            }
        );

    button.classList.add("selected");

    selectedNationality =
        button.dataset.value;
}


/* ==========================================
   LOAD ROUND
========================================== */

function loadRound(){

    if(index >= gameData.length){

        showPopup(
            "🎉 GAME FINISHED!<br><br>" +
            "Final Score: " +
            score +
            " / " +
            gameData.length
        );

        roundNumber.textContent =
            "FINISHED";

        progressElement.textContent =
            gameData.length +
            " / " +
            gameData.length;

        return;
    }

    selectedCountry = "";
    selectedNationality = "";

    checking = false;

    const current =
        gameData[index];

    flagImage.src =
        "https://flagcdn.com/w640/" +
        current.code +
        ".png";

    flagImage.alt =
        "Flag of " +
        current.country;

    countryOptions.innerHTML = "";
    nationalityOptions.innerHTML = "";

    createCountryOptions();
    createNationalityOptions();

    roundNumber.textContent =
        "ROUND " +
        (index + 1);

    progressElement.textContent =
        (index + 1) +
        " / " +
        gameData.length;
}


/* ==========================================
   MARK CORRECT ANSWER
========================================== */

function markCorrectAnswers(current){

    document
        .querySelectorAll(
            "#countryOptions .option"
        )
        .forEach(
            option => {

                if(
                    option.dataset.value ===
                    current.country
                ){

                    option.classList.add(
                        "correct"
                    );

                }

            }
        );

    document
        .querySelectorAll(
            "#nationalityOptions .option"
        )
        .forEach(
            option => {

                if(
                    option.dataset.value ===
                    current.nationality
                ){

                    option.classList.add(
                        "correct"
                    );

                }

            }
        );
}


/* ==========================================
   CHECK ANSWER
========================================== */

function checkAnswer(){

    if(checking){
        return;
    }

    if(
        selectedCountry === "" ||
        selectedNationality === ""
    ){

        showPopup(
            "⚠️ SELECT BOTH ANSWERS!"
        );

        return;
    }

    const current =
        gameData[index];

    const countryCorrect =
        selectedCountry ===
        current.country;

    const nationalityCorrect =
        selectedNationality ===
        current.nationality;


    /* ======================================
       CORRECT
    ====================================== */

    if(
        countryCorrect &&
        nationalityCorrect
    ){

        checking = true;

        score++;

        scoreElement.textContent =
            "SCORE: " +
            score;

        markCorrectAnswers(current);

        showPopup(
            "🎉 CORRECT!"
        );

        index++;

        setTimeout(
            () => {

                loadRound();

            },
            1000
        );

        return;
    }


    /* ======================================
       WRONG
    ====================================== */

    showPopup(
        "❌ WRONG! TRY AGAIN!"
    );


    if(!countryCorrect){

        document
            .querySelectorAll(
                "#countryOptions .option"
            )
            .forEach(
                option => {

                    if(
                        option.dataset.value ===
                        selectedCountry
                    ){

                        option.classList.add(
                            "wrong"
                        );

                    }

                }
            );

    }


    if(!nationalityCorrect){

        document
            .querySelectorAll(
                "#nationalityOptions .option"
            )
            .forEach(
                option => {

                    if(
                        option.dataset.value ===
                        selectedNationality
                    ){

                        option.classList.add(
                            "wrong"
                        );

                    }

                }
            );

    }


    setTimeout(
        () => {

            document
                .querySelectorAll(
                    ".option"
                )
                .forEach(
                    option => {

                        option.classList.remove(
                            "wrong"
                        );

                    }
                );

        },
        800
    );
}


/* ==========================================
   POPUP
========================================== */

function showPopup(message){

    popup.innerHTML = message;

    popup.classList.add("show");

    setTimeout(
        () => {

            popup.classList.remove("show");

        },
        1200
    );
}


/* ==========================================
   START NEW GAME
========================================== */

function startGame(){

    gameData =
        shuffle(
            [...data]
        );

    index = 0;

    score = 0;

    selectedCountry = "";

    selectedNationality = "";

    checking = false;

    scoreElement.textContent =
        "SCORE: 0";

    loadRound();
}


/* ==========================================
   CHECK BUTTON
========================================== */

checkButton.addEventListener(
    "click",
    checkAnswer
);


/* ==========================================
   NEW ROUND
========================================== */

newRoundButton.addEventListener(
    "click",
    startGame
);


/* ==========================================
   RESET
========================================== */

resetButton.addEventListener(
    "click",
    startGame
);


/* ==========================================
   START
========================================== */

startGame();

</script>
