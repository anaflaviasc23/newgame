<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>This, That, These & Those</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f4f2;

    color: #111;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

}


/* =====================================================
   GAME
===================================================== */

.game {

    width: 100%;

    max-width: 950px;

    background: #fff;

    border: 3px solid #111;

    box-shadow: 8px 8px 0 #111;

    padding: 30px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    border-bottom: 3px solid #111;

    padding-bottom: 20px;

    margin-bottom: 20px;

}

.header h1 {

    margin: 0;

    color: #111;

    font-size: 32px;

    font-weight: 900;

    letter-spacing: 1px;

}

.header p {

    margin: 8px 0 0;

    color: #555;

    font-size: 15px;

}


/* =====================================================
   INFO
===================================================== */

.info {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #111;

    color: #fff;

    padding: 11px 18px;

    margin-bottom: 20px;

    font-weight: bold;

    font-size: 16px;

}


/* =====================================================
   PROGRESS BAR
===================================================== */

.progress-container {

    width: 100%;

    height: 8px;

    background: #ddd;

    overflow: hidden;

    margin-bottom: 25px;

}

.progress {

    height: 100%;

    width: 0%;

    background: #111;

    transition: width .3s ease;

}


/* =====================================================
   IMAGE
===================================================== */

.image-box {

    width: 100%;

    height: 350px;

    background: #fafafa;

    border: 3px dashed #111;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

}

#scene {

    width: 100%;

    height: 100%;

}

#scene svg {

    width: 100%;

    height: 100%;

    display: block;

}


/* =====================================================
   QUESTION
===================================================== */

.question {

    text-align: center;

    margin: 25px 0 20px;

}

.question h2 {

    margin: 0;

    font-size: 25px;

    color: #111;

    font-weight: 900;

}

.blank {

    color: #e91e63;

    font-weight: 900;

}


/* =====================================================
   ANSWERS
===================================================== */

.answers {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;

}

.answer {

    background: #f4f4f2;

    color: #111;

    border: 3px solid #111;

    padding: 16px;

    min-height: 60px;

    font-size: 19px;

    font-weight: 900;

    cursor: pointer;

    transition: .15s;

    box-shadow: 4px 4px 0 #111;

}

.answer:hover:not(:disabled) {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #111;

    background: #e9e3dc;

}

.answer:active:not(:disabled) {

    transform:
        translate(4px, 4px);

    box-shadow: none;

}

.answer:disabled {

    cursor: default;

}


/* =====================================================
   CORRECT / WRONG
===================================================== */

.answer.correct {

    background: #111;

    border-color: #111;

    color: #fff;

}

.answer.wrong {

    background: #e91e63;

    border-color: #111;

    color: #fff;

}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    text-align: center;

    min-height: 28px;

    margin: 20px 0;

    font-size: 18px;

    font-weight: 900;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next {

    display: block;

    margin: auto;

    padding: 14px 30px;

    border: 3px solid #111;

    background: #111;

    color: #fff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 #ccc;

}

.next:hover {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #ccc;

}

.next:active {

    transform:
        translate(4px, 4px);

    box-shadow: none;

}


/* =====================================================
   FINAL
===================================================== */

.final {

    text-align: center;

    padding: 40px 10px;

}

.final h2 {

    color: #111;

    font-size: 32px;

    font-weight: 900;

}

.final p {

    font-size: 20px;

    font-weight: bold;

    line-height: 1.7;

}

.restart {

    border: 3px solid #111;

    background: #111;

    color: white;

    padding: 14px 28px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 #ccc;

}

.restart:hover {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #ccc;

}

.restart:active {

    transform:
        translate(4px, 4px);

    box-shadow: none;

}


.hidden {

    display: none !important;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

    body {

        padding: 15px;

        align-items: flex-start;

    }

    .game {

        margin-top: 8px;

        padding: 20px;

        box-shadow: 5px 5px 0 #111;

    }

    .header {

        flex-direction: column;

        align-items: stretch;

        text-align: center;

    }

    .header h1 {

        font-size: 27px;

    }

    .info {

        justify-content: center;

        gap: 20px;

        flex-wrap: wrap;

    }

    .image-box {

        height: 280px;

    }

    .question h2 {

        font-size: 21px;

    }

    .answers {

        grid-template-columns: 1fr;

    }

    .answer {

        padding: 15px;

    }

}


@media(max-width: 450px) {

    .game {

        padding: 15px;

    }

    .image-box {

        height: 245px;

    }

}

</style>

</head>

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const newArray =
        [...array];

    for(
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] =
        [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;

}


/* =====================================================
   OBJETOS ALEATÓRIOS
===================================================== */

function getRandomObjects(amount) {

    return shuffle(objects)
        .slice(0, amount);

}


/* =====================================================
   CRIAR 30 QUESTÕES
===================================================== */

function createQuestions() {

    const generated = [];


    /* THIS */

    getRandomObjects(8)
        .forEach(obj => {

            generated.push(
                createQuestion(
                    demonstratives[0],
                    obj
                )
            );

        });


    /* THAT */

    getRandomObjects(7)
        .forEach(obj => {

            generated.push(
                createQuestion(
                    demonstratives[1],
                    obj
                )
            );

        });


    /* THESE */

    getRandomObjects(8)
        .forEach(obj => {

            generated.push(
                createQuestion(
                    demonstratives[2],
                    obj
                )
            );

        });


    /* THOSE */

    getRandomObjects(7)
        .forEach(obj => {

            generated.push(
                createQuestion(
                    demonstratives[3],
                    obj
                )
            );

        });


    return shuffle(generated);

}


/* =====================================================
   CRIAR QUESTÃO
===================================================== */

function createQuestion(
    demonstrative,
    object
) {

    let sentence;


    if(
        demonstrative.singular
    ) {

        sentence =
            `______ is ${object.article} ${object.singular}.`;

    }

    else {

        sentence =
            `______ are ${object.plural}.`;

    }


    return {

        type:
            demonstrative.type,

        correct:
            demonstrative.word,

        object:
            object,

        sentence:
            sentence,

        singular:
            demonstrative.singular,

        near:
            demonstrative.near

    };

}

    progress.style.width =

}


/* =====================================================
   CARREGAR QUESTÃO
===================================================== */

function loadQuestion() {

    answered = false;


    const question =
        questions[currentQuestion];


    questionNumber.textContent =
        `Question ${currentQuestion + 1}/${TOTAL_QUESTIONS}`;


    updateProgress();


    scene.innerHTML =
        createScene(question);


    questionText.innerHTML =
        question.sentence.replace(
            "______",
            `<span class="blank">______</span>`
        );


    feedback.innerHTML = "";


    nextButton.classList.add(
        "hidden"
    );


    answers.innerHTML = "";


    /* =================================================
       ALTERNATIVAS
    ================================================= */

    shuffle(
        demonstratives
    ).forEach(
        demonstrative => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                demonstrative.word;


            button.dataset.answer =
                demonstrative.word;


            button.addEventListener(
                "click",
                function() {

                    checkAnswer(
                        this,
                        this.dataset.answer,
                        question.correct
                    );

                }
            );


            answers.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   VERIFICAR RESPOSTA
===================================================== */

function checkAnswer(
    selectedButton,
    selectedAnswer,
    correctAnswer
) {

    if(answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        button => {

            button.disabled = true;

        }
    );


    /* =================================================
       MOSTRAR RESPOSTA CORRETA
    ================================================= */

    buttons.forEach(
        button => {

            if(
                button.dataset.answer ===
                correctAnswer
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    /* =================================================
       ACERTO
    ================================================= */

    if(
        selectedAnswer ===
        correctAnswer
    ) {

        selectedButton.classList.add(
            "correct"
        );


        score += POINTS_PER_QUESTION;


        scoreElement.textContent =
            score;


        feedback.innerHTML =

            `✅ Correct!
             <strong>${correctAnswer}</strong>
             is the correct answer.`;

    }


    /* =================================================
       ERRO
    ================================================= */

    else {

        selectedButton.classList.add(
            "wrong"
        );


        feedback.innerHTML =

            `❌ Incorrect!
             The correct answer is
             <strong>${correctAnswer}</strong>.`;

    }


    nextButton.classList.remove(
        "hidden"
    );

}


/* =====================================================
   PRÓXIMA QUESTÃO
===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        currentQuestion++;


        if(
            currentQuestion >=
            questions.length
        ) {

            showFinal();

            return;

        }


        loadQuestion();

    }
);


/* =====================================================
   FINAL
===================================================== */

function showFinal() {

    gameArea.classList.add(
        "hidden"
    );


    finalScreen.classList.remove(
        "hidden"
    );


    progress.style.width =
        "100%";


    const maxScore =
        TOTAL_QUESTIONS *
        POINTS_PER_QUESTION;


    const percentage =
        Math.round(
            (
                score /
                maxScore
            ) * 100
        );


    let message;


    if(
        percentage >= 90
    ) {

        message =
            "🌟 Excellent!";

    }

    else if(
        percentage >= 70
    ) {

        message =
            "👏 Very good!";

    }

    else if(
        percentage >= 50
    ) {

        message =
            "👍 Good job! Keep practicing!";

    }

    else {

        message =
            "📚 Keep practicing! You can do it!";

    }


    finalScore.innerHTML = `

        ${message}

        <br><br>

        You scored

        <strong>
            ${score}
        </strong>

        out of

        <strong>
            ${maxScore}
        </strong>

        points.

        <br>

        Accuracy:

        <strong>
            ${percentage}%
        </strong>

    `;

}


/* =====================================================
   REINICIAR
===================================================== */

restartButton.addEventListener(
    "click",
    function() {

        currentQuestion = 0;

        score = 0;

        answered = false;


        scoreElement.textContent =
            "0";


        questions =
            createQuestions();


        finalScreen.classList.add(
            "hidden"
        );


        gameArea.classList.remove(
            "hidden"
        );


        loadQuestion();

    }
);


/* =====================================================
   INICIAR
===================================================== */

questions =
    createQuestions();


loadQuestion();

</script>
