<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo AM / IS / ARE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f2;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    /* CARD PRINCIPAL */
    .container {
      width: 100%;
      max-width: 950px;
      background: #fff;
      border: 3px solid #111;
      box-shadow: 8px 8px 0 #111;
      padding: 30px;
      text-align: center;
    }

    /* CABEÇALHO */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      border-bottom: 3px solid #111;
      padding-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .score-box {
      background: #111;
      color: #fff;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 18px;
      white-space: nowrap;
    }

    /* INSTRUÇÃO */
    .instruction {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    /* PERGUNTA */
    .question-area {
      border: 3px dashed #111;
      padding: 35px 20px;
      margin-bottom: 30px;
      background: #fafafa;
    }

    .question {
      font-size: 34px;
      font-weight: bold;
      margin: 0;
    }

    /* BOTÕES */
    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      max-width: 700px;
      margin: 0 auto;
    }

    .buttons button {
      border: 3px solid #111;
      background: #f4f4f2;
      color: #111;
      padding: 22px 20px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #111;
      transition: 0.15s;
    }

    .buttons button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #111;
      background: #e9e3dc;
    }

    .buttons button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    /* PROGRESSO */
    .progress-container {
      margin-top: 30px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .progress {
      height: 14px;
      background: #e5e5e5;
      border: 2px solid #111;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: 0.3s;
    }

    /* POPUP */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
      z-index: 1000;
      cursor: pointer;
      padding: 20px;
    }

    .popup.show {
      visibility: visible;
      opacity: 1;
    }

    .popup-content {
      background: #fff;
      color: #111;
      border: 3px solid #111;
      box-shadow: 8px 8px 0 #111;
      padding: 35px 50px;
      font-size: 30px;
      font-weight: 900;
      text-align: center;
      white-space: pre-line;
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* FIM DO JOGO */
    .end-screen {
      text-align: center;
    }

    .end-screen h1 {
      margin-bottom: 20px;
    }

    .end-screen p {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .restart-button {
      border: 3px solid #111;
      background: #111;
      color: #fff;
      padding: 16px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 5px 5px 0 #ccc;
    }

    .restart-button:hover {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #ccc;
    }

    /* MOBILE */
    @media (max-width: 650px) {

      body {
        padding: 15px;
      }

      .container {
        padding: 20px;
        box-shadow: 5px 5px 0 #111;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      h1 {
        font-size: 27px;
      }

      .score-box {
        text-align: center;
      }

      .question {
        font-size: 26px;
      }

      .question-area {
        padding: 28px 15px;
      }

      .buttons {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .buttons button {
        padding: 18px;
        font-size: 22px;
      }

      .popup-content {
        padding: 30px 25px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>AM / IS / ARE</h1>

      <div class="score-box" id="score">
        Score: 0 / 20
      </div>
    </div>

    <div class="instruction">
      CHOOSE THE CORRECT ANSWER
    </div>

    <div class="question-area">
      <div class="question" id="question"></div>
    </div>

    <div class="buttons">
      <button onclick="checkAnswer('am')">AM</button>
      <button onclick="checkAnswer('is')">IS</button>
      <button onclick="checkAnswer('are')">ARE</button>
    </div>

    <div class="progress-container">

      <div class="progress-label">
        <span>PROGRESS</span>
        <span id="progress-text">1 / 20</span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

    </div>

  </div>

  <!-- POPUP -->

  <div class="popup" id="popup" onclick="nextStep()">
    <div class="popup-content" id="popup-text"></div>
  </div>


<script>

const questions = [
  { q: "We _______ from France.", a: "are" },
  { q: "It ______ correct.", a: "is" },
  { q: "I _______ OK, thanks.", a: "am" },
  { q: "They _______ sisters.", a: "are" },
  { q: "She _______ an English teacher.", a: "is" },
  { q: "They _______ Brazilians.", a: "are" },
  { q: "We _______ in Brazil.", a: "are" },
  { q: "She ______ your daughter.", a: "is" },
  { q: "I _______ a student.", a: "am" },
  { q: "It _______ a Chinese city.", a: "is" },
  { q: "It _______ in Rio de Janeiro.", a: "is" },
  { q: "It ______ big.", a: "is" },
  { q: "He ______ a teacher.", a: "is" },
  { q: "She ______ Brazilian.", a: "is" },
  { q: "He ______ Argentinian.", a: "is" },
  { q: "You _______ right.", a: "are" },
  { q: "He ______ Marcelo.", a: "is" },
  { q: "They ______ at the hotel.", a: "are" },
  { q: "It _______ a pillow.", a: "is" },
  { q: "She ______ my mother.", a: "is" }
];

let current = 0;
let score = 0;
let waiting = false;


/* CARREGA PERGUNTA */

function loadQuestion() {

  document.getElementById("question").innerText =
    questions[current].q;

  updateProgress();
  updateScore();
}


/* VERIFICA RESPOSTA */

function checkAnswer(answer) {

  if (waiting) return;

  const correct = questions[current].a;

  const popup = document.getElementById("popup");
  const popupText = document.getElementById("popup-text");

  if (answer === correct) {

    score++;

    popupText.innerText = "🎉 CORRECT!";

  } else {

    popupText.innerText =
      `❌ WRONG!\nCorrect: ${correct.toUpperCase()}`;

  }

  popup.classList.add("show");

  waiting = true;
}


/* PRÓXIMA QUESTÃO */

function nextStep() {

  const popup = document.getElementById("popup");

  popup.classList.remove("show");

  current++;

  waiting = false;

  if (current < questions.length) {

    loadQuestion();

  } else {

    endGame();

  }
}


/* ATUALIZA PONTUAÇÃO */

function updateScore() {

  document.getElementById("score").innerText =
    `Score: ${score} / ${questions.length}`;
}


/* ATUALIZA PROGRESSO */

function updateProgress() {

  const percent =
    (current / questions.length) * 100;

  document.getElementById("progress-bar").style.width =
    percent + "%";

  document.getElementById("progress-text").innerText =
    `${current + 1} / ${questions.length}`;
}


/* FIM DO JOGO */

function endGame() {

  document.querySelector(".container").innerHTML = `

    <div class="end-screen">

      <h1>Fim do jogo 🎯</h1>

      <p>
        Você acertou ${score} de ${questions.length}!
      </p>

      <button
        class="restart-button"
        onclick="location.reload()">
        JOGAR NOVAMENTE
      </button>

    </div>

  `;
}


/* INICIA */

loadQuestion();
updateScore();

</script>

</body>
</html>
